# Extra release artifacts, alongside the all-in-one Windows installer.
#
# release.yml is untouched and still builds Crundi-Setup-<version>.exe exactly
# as it always has. This is a SEPARATE workflow so a problem here cannot stop
# that one shipping — if this fails, the main installer is unaffected.
#
# Run it by hand first (Actions → this workflow → Run workflow) before trusting
# it on a tag. Recovering the known-good release workflow, if ever needed:
#   git show v1.3.0:.github/workflows/release.yml
#
# Produces:
#   Crundi-Client-Setup-<version>.exe   desktop app with no server, attaches to one
#   crundi-server-<version>.zip         headless server for Windows
#   Crundi-<version>-linux-x64.deb      desktop app for Ubuntu, with a server
#   Crundi-Client-<version>-linux-x64.deb   desktop app for Ubuntu, client only
#   ghcr.io/<owner>/crundi:<version>    Linux server image
name: Release extras

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach artifacts to the matching GitHub Release'
        type: boolean
        default: false
      tag:
        description: 'Release tag to attach to (e.g. v1.4.0). Needed on a manual run.'
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  client:
    name: Windows client installer
    runs-on: windows-latest
    # A job that hangs should die in minutes, not burn six hours of the
    # default. A test with an unbounded scan hung every Windows job here.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same gate as the main release: a SyntaxError in the page's own JS is
      # invisible to node --check and would ship a UI that dies at boot.
      - name: Check syntax
        run: npm run check

      - name: Build client installer
        run: npx electron-builder --win --config build/electron-builder-client.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          # The .yml is the update manifest: without it the installed client has
          # nothing of its own to read and falls back to the all-in-one's.
          path: |
            dist/client/Crundi-Client-Setup-*.exe
            dist/client/client.yml
          if-no-files-found: error

  server-windows:
    name: Windows server package
    runs-on: windows-latest
    # A job that hangs should die in minutes, not burn six hours of the
    # default. A test with an unbounded scan hung every Windows job here.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Check syntax
        run: npm run check

      # Production dependencies only: no electron, no electron-builder. The
      # server never renders anything.
      - name: Stage the package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p staging/crundi-server
          cp -r src scripts assets skills package.json package-lock.json staging/crundi-server/
          mkdir -p staging/crundi-server/app
          cp -r app/vendor staging/crundi-server/app/
          cp docker/.env.example staging/crundi-server/.env.example
          # Same pinned browser as the Linux tarball. The Windows server is a
          # zip you extract and run — there is no installer to fetch one later,
          # so if it is not in here the browser tools have nothing to drive.
          CHROME_VER=$(node -p "require('./package.json').chromeVersion || ''")
          if [ -z "$CHROME_VER" ]; then echo "No chromeVersion pinned"; exit 1; fi
          curl -fsSL --retry 3 --max-time 600 -o chrome.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VER}/win64/chrome-win64.zip"
          mkdir -p "staging/crundi-server/chrome/win-${CHROME_VER}"
          # Git Bash on the Windows runner has no unzip; PowerShell always does.
          unzip -q chrome.zip -d unpacked 2>/dev/null \
            || powershell -NoProfile -Command "Expand-Archive -Path chrome.zip -DestinationPath unpacked -Force"
          mv unpacked/chrome-win64 "staging/crundi-server/chrome/win-${CHROME_VER}/"
          rm -rf chrome.zip unpacked
          test -f "staging/crundi-server/chrome/win-${CHROME_VER}/chrome-win64/chrome.exe"
          echo "bundled Chrome ${CHROME_VER} for Windows"
          cd staging/crundi-server
          npm ci --omit=dev --ignore-scripts=false
          cd ..
          cp ../docker/README.md crundi-server/DOCKER.md || true

      - name: Add a launcher
        shell: bash
        run: |
          cat > staging/crundi-server/start.cmd <<'EOF'
          @echo off
          REM Crundi server. Copy .env.example to .env and fill it in first,
          REM or set a password from the first-run screen in the browser.
          node --no-deprecation src\index.js
          EOF
          cat > staging/crundi-server/README.txt <<'EOF'
          Crundi server (Windows)

            1. Install Node.js 22 or newer.
            2. Run start.cmd
            3. Open http://localhost:8888 and set up a way to sign in.

          Until a sign-in method is configured the server does exactly one
          thing: let someone configure one. Nothing else is reachable. It is
          still first-come, so do this before exposing the port.

          To run it as a service, see the service:* scripts in package.json
          (they use pm2), or use your preferred supervisor.

          Data lives in %APPDATA%\Crundi\data unless DATA_DIR says otherwise.
          Back that up: it holds your projects list, history and credentials.
          EOF

      # Nothing else in this job creates dist/ — it never runs electron-builder,
      # and Compress-Archive will not make the destination directory itself.
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path staging/crundi-server -DestinationPath "dist/crundi-server-${env:VERSION}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: dist/crundi-server-*.zip
          if-no-files-found: error

  server-linux:
    name: Linux server tarball
    runs-on: ubuntu-latest
    # A job that hangs should die in minutes, not burn six hours of the
    # default. A test with an unbounded scan hung every Windows job here.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Check syntax
        run: npm run check

      # The whole point of this artifact: node_modules is built HERE, on Linux,
      # so installing it needs no compiler. node-pty ships no prebuilt binary of
      # its own, and asking every user to install a C++ toolchain to get a
      # terminal is a poor trade.
      - name: Stage with prebuilt native modules
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p staging/crundi
          cp -r src scripts assets skills package.json package-lock.json staging/crundi/
          mkdir -p staging/crundi/app
          cp -r app/vendor staging/crundi/app/
          cp docker/.env.example staging/crundi/.env.example
          cd staging/crundi
          npm ci --omit=dev --no-audit --no-fund
          # Native code is tied to Node's ABI, so record which one these were
          # built against. install.sh compares it and rebuilds if it differs
          # rather than shipping modules that will not load.
          node -p 'process.versions.modules' > .prebuilt
          node -e "require('node-pty'); console.log('node-pty loads')"

      - name: Verify the tree runs from a clean shell
        run: |
          cd staging/crundi
          # Not a full boot — no config yet — but it proves every import
          # resolves, which is what a broken prebuild would break.
          node --input-type=module -e "
            await import('./src/config.js').catch(e => { if (!/login method|Missing required/.test(e.message)) throw e; });
            await import('./src/auth-password.js');
            await import('./src/web-push.js');
            console.log('imports resolve');
          "

      # The browser ships WITH the release rather than being fetched at install
      # time, so every server on a given version runs the exact same Chrome.
      # Resolving "current stable" during install meant two boxes set up a month
      # apart could differ, which is the kind of drift nobody discovers until a
      # page renders differently on one of them.
      #
      # Only the standalone server needs it: the desktop build ships Electron,
      # which is already a browser host.
      - name: Bundle the pinned browser
        run: |
          CHROME_VER=$(node -p "require('./package.json').chromeVersion || ''")
          if [ -z "$CHROME_VER" ]; then echo "No chromeVersion pinned in package.json"; exit 1; fi
          echo "Bundling Chrome for Testing $CHROME_VER"
          curl -fsSL --retry 3 --max-time 600 -o chrome.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VER}/linux64/chrome-linux64.zip"
          mkdir -p "staging/crundi/chrome/linux-${CHROME_VER}"
          unzip -q chrome.zip -d unpacked
          mv unpacked/chrome-linux64 "staging/crundi/chrome/linux-${CHROME_VER}/"
          chmod +x "staging/crundi/chrome/linux-${CHROME_VER}/chrome-linux64/chrome"
          # A browser that cannot report its own version is not one worth shipping.
          "staging/crundi/chrome/linux-${CHROME_VER}/chrome-linux64/chrome" --version
          rm -rf chrome.zip unpacked

      - name: Tar
        run: |
          mkdir -p dist
          tar czf "dist/crundi-server-linux-x64-${VERSION}.tar.gz" -C staging crundi
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: dist/crundi-server-linux-*.tar.gz
          if-no-files-found: error

  desktop-linux:
    name: Linux desktop packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node_modules is built HERE, on Linux, against this Node: node-pty has
      # no prebuilt binary for Linux, and cloudflared fetches the Linux one.
      - run: npm ci
      - name: Check syntax
        run: npm run check

      # The all-in-one package carries its own Node, the very one its native
      # modules were just built against. The server then starts on a machine
      # that has no Node, or one too old, and never loads a module built for
      # another version. (build/linux-node is where package.json expects it.)
      - name: Stage the bundled Node
        run: |
          mkdir -p build/linux-node/bin
          cp "$(command -v node)" build/linux-node/bin/node
          build/linux-node/bin/node --version
          build/linux-node/bin/node -e "require('node-pty'); console.log('node-pty loads')"
          test -s node_modules/cloudflared/bin/cloudflared

      - name: Build the all-in-one package
        run: npx electron-builder --linux --publish never
      - name: Build the client package
        run: npx electron-builder --linux --config build/electron-builder-client.yml --publish never

      - name: Check what is inside them
        run: |
          full=$(ls dist/Crundi-*-linux-x64.deb)
          client=$(ls dist/client/Crundi-Client-*-linux-x64.deb)
          dpkg-deb -c "$full" > full.txt
          dpkg-deb -c "$client" > client.txt
          need() { grep -q "$2" "$1" || { echo "missing from $1: $2" >&2; exit 1; }; }
          need full.txt 'resources/node/bin/node$'
          need full.txt 'app.asar.unpacked/src/index.js$'
          need full.txt 'node_modules/node-pty/build/Release/pty.node$'
          need full.txt 'node_modules/cloudflared/bin/cloudflared$'
          need full.txt 'resources/skills/crundi/SKILL.md$'
          need client.txt 'node_modules/electron-updater/package.json$'
          # No server in the client: that absence is how the app knows it is one.
          if grep -q 'app.asar.unpacked/src/index.js$\|resources/node/' client.txt; then
            echo "the client package contains a server" >&2; exit 1
          fi
          # The update files, named for the platform so that one release can
          # hold Windows and Linux builds without either reading the other's.
          grep -q "url: $(basename "$full")" dist/latest-linux.yml
          grep -q "url: $(basename "$client")" dist/client/client-linux.yml

      # Installed and started for real, on a screen that is not there. This is
      # the check that the package installs on Ubuntu, that Chromium's sandbox
      # is allowed to start (Ubuntu 24.04 refuses it without the profile the
      # package installs), and that the app gets as far as showing a window.
      - name: Install both and start them
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ./dist/Crundi-*-linux-x64.deb ./dist/client/Crundi-Client-*-linux-x64.deb
          # Everything each app said is printed, pass or fail: the first
          # version of this step captured the second app's output to read one
          # line of it, and so showed nothing at all when that app failed.
          started() {
            name="$1"; shift
            home=$(mktemp -d)
            HOME="$home" XDG_CONFIG_HOME="$home/.config" timeout 40 xvfb-run -a "$@" > "$home/out.txt" 2>&1 || true
            LOG=$(find "$home/.config" -name crundi.log 2>/dev/null | head -1)
            echo "── $name ──"
            echo "config folders: $(ls "$home/.config" 2>/dev/null | tr '\n' ' ')"
            if [ -n "$LOG" ]; then grep -v 'builder-util-runtime\|^Headers\|^  "\|^}' "$LOG" | tail -40; fi
            echo "── $name, what it printed ──"; tail -20 "$home/out.txt"
            if [ -z "$LOG" ] || ! grep -q 'Window ready-to-show' "$LOG"; then
              echo "$name did not get as far as showing its window" >&2; exit 1
            fi
          }
          started 'the client' crundi-client
          started 'the all-in-one app' crundi
          # Its own settings folder, never the one a server installed with
          # install.sh uses, and with nothing set up yet it asks, not starts.
          grep -q 'userDataDir=.*/crundi-desktop' "$LOG" || { echo "the all-in-one app is not using its own settings folder" >&2; exit 1; }
          grep -q 'opening setup wizard' "$LOG" || { echo "the all-in-one app did not open its setup wizard" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            dist/Crundi-*-linux-x64.deb
            dist/latest-linux.yml
            dist/client/Crundi-Client-*-linux-x64.deb
            dist/client/client-linux.yml
          if-no-files-found: error

  server-image:
    name: Linux server image
    runs-on: ubuntu-latest
    # A job that hangs should die in minutes, not burn six hours of the
    # default. A test with an unbounded scan hung every Windows job here.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      # ghcr.io rejects any uppercase in the repository name, and this owner
      # has some. github.repository_owner is verbatim, so lowercase it here
      # rather than hardcoding the name.
      - name: Lowercase the owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged builds publish; a manual run builds only, so the workflow can be
      # exercised without pushing anything.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # A manual run's ref is a BRANCH, so gating on the ref alone meant a
          # re-run built the image, pushed nothing, and still reported success.
          push: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
          # :latest is production only; a dev build (version with a "-") moves :dev.
          tags: |
            ghcr.io/${{ env.OWNER }}/crundi:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER }}/crundi:${{ contains(env.VERSION, '-') && 'dev' || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  attach:
    name: Attach to the release
    needs: [client, server-windows, server-linux, desktop-linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    # A job that hangs should die in minutes, not burn six hours of the
    # default. A test with an unbounded scan hung every Windows job here.
    timeout-minutes: 25
    steps:
      # Named explicitly rather than "download everything". buildx also uploads
      # a .dockerbuild metadata artifact, which is not a release asset and
      # whose download failed the whole job once already.
      - uses: actions/download-artifact@v4
        with:
          name: windows-client
          path: artifacts/windows-client
      - uses: actions/download-artifact@v4
        with:
          name: windows-server
          path: artifacts/windows-server
      - uses: actions/download-artifact@v4
        with:
          name: linux-server
          path: artifacts/linux-server
      - uses: actions/download-artifact@v4
        with:
          name: linux-desktop
          path: artifacts/linux-desktop

      # Added to the release the main workflow created, rather than creating
      # one — so the installer it publishes stays the primary asset.
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On a tag push GITHUB_REF_NAME is the tag; on a manual run it is the
          # branch, which is not a release. Take the input in that case.
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          # Wait for the release to exist before uploading into it.
          #
          # This workflow and the Release workflow start from the same tag push
          # and run in parallel, but only the other one creates the release.
          # Whether these builds finish first is a coin toss: 1.9.1 and 1.9.3
          # won it, 1.9.4 lost and every upload failed with "release not found",
          # publishing a version with no Linux tarball and no client installer.
          # The updater then offers an update it cannot install.
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG exists (after ${attempt} check(s))"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "The release $TAG never appeared — the Release workflow must have failed."
              exit 1
            fi
            sleep 10
          done
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.yml' \) -print0 \
            | xargs -0 -I{} gh release upload "$TAG" "{}" --clobber --repo "$GITHUB_REPOSITORY"
