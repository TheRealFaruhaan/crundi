name: Release

# Cut a release by tagging main's top commit and pushing the tag:
#   git tag v1.2.0 && git push origin v1.2.0
# A dev release is a prerelease version tagged on dev's top commit:
#   git tag v1.2.1-dev.1 && git push origin v1.2.1-dev.1
# Any tag with a "-" is published as a GitHub PRERELEASE from the start, so
# "latest release" (what production installs follow) never points at it.
# Since the native client replaced Electron (native-v2/, 1.21.8-dev.9), the
# desktop installers are the native ones: native-v2-package.yml builds them,
# runs the upgrade test from the latest Electron release and attaches them
# with their update feeds, under Electron's names (CONTRACT.md), so Electron
# installs update themselves into the native client. release-extra.yml adds
# the server packages, images and the worker. Building on a clean runner also
# avoids the flaky large-asset uploads we hit from a local machine.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The checks the Electron build ran before publishing: nothing is released
  # unless they pass. On Windows, where they always ran.
  check:
    runs-on: windows-latest
    # A job that hangs should die in minutes, not burn six hours of the
    # default. A test with an unbounded scan hung every Windows job here.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci can report complete success while a package's postinstall has
      # quietly failed to fetch its binary (1.9.2 shipped without cloudflared).
      # The native installer stages the server's node_modules the same way.
      - name: Verify the native payloads actually downloaded
        shell: bash
        run: |
          missing=0
          for f in \
            "node_modules/cloudflared/bin/cloudflared.exe" \
            "node_modules/node-pty/prebuilds/win32-x64/winpty-agent.exe"
          do
            if [ -s "$f" ]; then
              echo "ok   $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING  $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "A binary payload is missing — refusing to ship a half-built installer."; exit 1; }

      # webapp-html.js is one big template literal, so a SyntaxError in the
      # page's own JS gets past `node --check`; this runs the full check.
      - name: Check syntax and tests
        run: npm run check

  # The release itself, made before any upload (release-extra.yml waits for
  # it). A tag with a "-" is a prerelease from the start, so there is no
  # window in which a dev build is the latest release.
  create:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            PRE=(); case "$TAG" in *-*) PRE=(--prerelease) ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "${TAG#v}" --notes "" "${PRE[@]}"
          fi

  # The native installers (both editions, Windows and Linux) and their feeds.
  desktop:
    needs: create
    uses: ./.github/workflows/native-v2-package.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
