[package]
name = "crundi-desktop"
description = "The desktop area: the browser drawer, the Browsers tab, tray, Inbox, bubble, saved passwords, Cru"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
serde_json.workspace = true
crundi-core.workspace = true
crundi-theme.workspace = true
crundi-widgets.workspace = true
crundi-shell.workspace = true
crundi-webview.workspace = true
crundi-workbench.workspace = true
crundi-chats.workspace = true
crundi-chat-model.workspace = true
crundi-chat-log.workspace = true
crundi-chat-composer.workspace = true
tungstenite.workspace = true
base64.workspace = true
chrono.workspace = true
image.workspace = true
open.workspace = true
gethostname.workspace = true
rfd.workspace = true

# Phase 6 (shared/requests.md: asked of the Lead since the Slint client;
# added to this crate only, pinned): the tray, and saved passwords' key in
# the OS keychain with AES-GCM.
aes-gcm = "=0.10.3"
# "Hey Cru" (phase 6.6): sherpa-onnx's keyword spotter and speaker embedding,
# its static libraries linked in (no code loaded at run time); the model is
# data, downloaded once and checked (wake/engine.rs).
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }
sha2 = "0.10"
bzip2 = "0.5"
tar = "0.4"
ureq.workspace = true
cpal.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.7", default-features = false, features = ["blocking", "async-io"] }
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "=0.21.2"
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "=0.21.2"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
