[package]
name = "crundi-worker"
version = "0.1.0"
edition = "2021"
description = "Crundi worker: joins a PC to a Crundi server (info, labels, pause, terminal)"
license = "MIT"
publish = false

[lib]
name = "crundi_worker"
path = "src/lib.rs"

[[bin]]
name = "crundi-worker"
path = "src/main.rs"

[features]
default = ["tray"]
tray = ["dep:tray-icon", "dep:tao", "dep:webbrowser"]

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
portable-pty = "0.9"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "io-std", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
webbrowser = { version = "1", optional = true }

tray-icon = { version = "0.26", optional = true }
tao = { version = "0.37", default-features = false, optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
