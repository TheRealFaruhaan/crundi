<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scan</title>
<style>
html,body{margin:0;height:100%;background:#0a0a0f;color:#e8e8f0;font-family:system-ui,sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#shade{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;box-sizing:border-box}
#frame{width:min(74vw,320px);aspect-ratio:1;border-radius:28px;border:3px solid rgba(129,140,248,.9);box-shadow:0 0 0 100vmax rgba(10,10,15,.55)}
#frame.hit{border-color:#10b981}
#say{position:relative;font-size:15px;line-height:1.4;text-align:center;max-width:300px;text-shadow:0 1px 3px #000}
#cancel{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:11px 26px;border-radius:999px;border:1px solid #2a2a3d;background:rgba(26,26,40,.9);color:#e8e8f0;font:inherit;font-size:15px}
</style>
</head>
<body>
<video id="v" playsinline autoplay muted></video>
<div id="shade"><div id="frame"></div><div id="say">Point at the picture on your server</div></div>
<button id="cancel" type="button">Cancel</button>
<script type="module" src="scan.js"></script>
</body>
</html>
