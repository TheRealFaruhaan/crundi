[package]
name = "spike-panel"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike: a screen compiled in its own crate, embedded in the window through ComponentContainer"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030", "unstable-fontique-011"] }

[build-dependencies]
slint-build = "=1.18.1"
