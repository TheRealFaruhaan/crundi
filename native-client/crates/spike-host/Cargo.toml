[package]
name = "spike-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike: a window embedding spike-panel's compiled component"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030", "unstable-fontique-011"] }
spike-panel = { path = "../spike-panel" }

[build-dependencies]
slint-build = "=1.18.1"
