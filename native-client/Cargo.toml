[package]
name = "crundi-native"
version = "0.1.0"
edition = "2021"
description = "Prototype: Crundi's desktop client in Rust, Slint and CEF (off-screen browser panels)"
license = "MIT"
publish = false

[dependencies]
cef = "156.4.0"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.27"
base64 = "0.22"
png = "0.17"

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
