[package]
name = "crundi-native"
version = "0.1.0"
edition = "2021"
description = "Prototype: Crundi's desktop client in Rust, Slint and CEF (off-screen browser panels)"
license = "MIT"
publish = false

[dependencies]
cef = "156.4.0"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
ureq = "3"
gethostname = "1"
open = "5"
base64 = "0.22"
png = "0.17"

[features]
# The GPU path: CEF hands over its frames as shared GPU textures (DMA-BUF on
# Linux, D3D11 on Windows, IOSurface on macOS), copied into wgpu textures that
# Slint draws directly. Turned on at run time with CRUNDI_GPU=1; the CPU path
# (on_paint) stays the default and the fallback.
gpu = ["slint/renderer-femtovg-wgpu", "slint/unstable-wgpu-30", "cef/accelerated_osr"]

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
