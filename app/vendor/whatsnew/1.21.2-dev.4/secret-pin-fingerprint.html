<div class="wna a-spf">
  <div class="phone">
    <div class="scr">
      <div class="tag">SECRET REQUEST</div>
      <div class="card"><span class="s">Claude wants</span><b>DEPLOY_TOKEN</b><span class="m">deploy chat</span></div>
      <div class="fld"><i class="d d1"></i><i class="d d2"></i><i class="d d3"></i><i class="d d4"></i></div>
      <div class="act">
        <div class="fp"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i><i class="tp t1"></i></div>
        <div class="unl">Unlock</div>
        <div class="sent"><span class="ck"><i></i></span>Sent</div>
      </div>
      <div class="keys"><span>1</span><span>2</span><span class="k3">3<i class="tp t2"></i></span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div>
    </div>
  </div>
  <div class="cap">
    <b>PIN behind your fingerprint</b>
    <span class="l l1">Touch: the PIN goes in</span>
    <span class="l l2">Type: Unlock comes back</span>
  </div>
  <style>
    .a-spf{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary)}
    .a-spf .phone{position:absolute;left:90px;top:24px;width:200px;height:352px;border-radius:28px;border:2px solid var(--border);background:var(--bg-secondary);padding:9px;box-sizing:border-box}
    .a-spf .scr{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:var(--bg-primary)}
    .a-spf .tag{position:absolute;left:0;right:0;top:18px;text-align:center;font-family:var(--mono,ui-monospace,monospace);font-size:8.5px;letter-spacing:.06em;color:var(--text-muted)}
    .a-spf .card{position:absolute;left:12px;right:12px;top:36px;padding:9px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);display:flex;flex-direction:column;gap:3px;text-align:center}
    .a-spf .card .s{font-size:10px;color:var(--text-secondary)}
    .a-spf .card b{font-family:var(--mono,ui-monospace,monospace);font-size:12.5px;color:var(--accent)}
    .a-spf .card .m{font-size:9px;color:var(--text-muted)}
    .a-spf .fld{position:absolute;left:24px;right:24px;top:112px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;gap:10px;animation:aspf-fld 11s ease infinite}
    .a-spf .d{width:9px;height:9px;border-radius:50%;background:var(--text-primary);opacity:0}
    .a-spf .d1{animation:aspf-d1 11s step-end infinite}
    .a-spf .d2{animation:aspf-d2 11s step-end infinite}
    .a-spf .d3{animation:aspf-d3 11s step-end infinite}
    .a-spf .d4{animation:aspf-d4 11s step-end infinite}
    .a-spf .act{position:absolute;left:0;right:0;top:156px;height:58px}
    .a-spf .fp{position:absolute;left:50%;top:2px;width:52px;height:52px;margin-left:-26px;border-radius:50%;border:1.5px solid var(--accent);background:var(--bg-card);box-sizing:border-box;animation:aspf-fp 11s ease infinite}
    .a-spf .fp i{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid var(--text-secondary);border-bottom-color:transparent;box-sizing:border-box;animation:aspf-arc 11s ease infinite}
    .a-spf .fp .a1{width:34px;height:34px;margin:-17px 0 0 -17px;transform:rotate(-10deg)}
    .a-spf .fp .a2{width:25px;height:25px;margin:-12px 0 0 -13px;transform:rotate(12deg)}
    .a-spf .fp .a3{width:16px;height:16px;margin:-7px 0 0 -8px;transform:rotate(-6deg)}
    .a-spf .fp .a4{width:6px;height:9px;margin:-2px 0 0 -3px;border-radius:3px;border-width:0 0 0 2px}
    .a-spf .tp{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.3);opacity:0}
    .a-spf .fp .tp{border:none;width:44px;height:44px;margin:-22px 0 0 -22px;animation:aspf-t1 11s ease infinite}
    .a-spf .unl{position:absolute;left:50%;top:11px;width:120px;height:34px;margin-left:-60px;border-radius:9px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;opacity:0;animation:aspf-unl 11s ease infinite}
    .a-spf .sent{position:absolute;left:0;right:0;top:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--green);opacity:0;animation:aspf-sent 11s ease infinite}
    .a-spf .ck{position:relative;width:26px;height:26px;border-radius:50%;background:var(--green)}
    .a-spf .ck i{position:absolute;left:9px;top:5px;width:6px;height:11px;border:solid var(--bg-primary);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
    .a-spf .keys{position:absolute;left:16px;right:16px;top:228px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
    .a-spf .keys span{position:relative;height:25px;border-radius:7px;background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--text-secondary)}
    .a-spf .t2{animation:aspf-t2 11s ease infinite}
    .a-spf .cap{position:absolute;left:330px;right:36px;top:150px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--text-secondary)}
    .a-spf .cap b{font-size:16px;color:var(--text-primary)}
    .a-spf .l{opacity:.35}
    .a-spf .l1{animation:aspf-l1 11s ease infinite}
    .a-spf .l2{animation:aspf-l2 11s ease infinite}
    @keyframes aspf-t1{0%,9%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1)}17%,100%{opacity:0;transform:scale(1.4)}}
    @keyframes aspf-t2{0%,61%{opacity:0;transform:scale(.4)}64%{opacity:1;transform:scale(1)}69%,100%{opacity:0;transform:scale(1.4)}}
    @keyframes aspf-arc{0%,11%{border-color:var(--text-secondary);border-bottom-color:transparent}14%,33%{border-color:var(--accent);border-bottom-color:transparent}36%,100%{border-color:var(--text-secondary);border-bottom-color:transparent}}
    @keyframes aspf-fp{0%,33%{opacity:1;transform:none}36%,55%{opacity:0;transform:scale(.8)}59%,64%{opacity:1;transform:none}67%,96%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:none}}
    @keyframes aspf-sent{0%,35%{opacity:0;transform:scale(.8)}38%,54%{opacity:1;transform:none}57%,100%{opacity:0;transform:scale(.8)}}
    @keyframes aspf-unl{0%,65%{opacity:0;transform:scale(.9)}68%,92%{opacity:1;transform:none}96%,100%{opacity:0;transform:scale(.9)}}
    @keyframes aspf-fld{0%,15%{border-color:var(--border)}18%,34%{border-color:var(--accent)}38%,64%{border-color:var(--border)}66%,92%{border-color:var(--accent)}96%,100%{border-color:var(--border)}}
    @keyframes aspf-d1{0%{opacity:0}19%{opacity:1}56%{opacity:0}65%{opacity:1}94%{opacity:0}}
    @keyframes aspf-d2{0%{opacity:0}23%{opacity:1}56%{opacity:0}}
    @keyframes aspf-d3{0%{opacity:0}27%{opacity:1}56%{opacity:0}}
    @keyframes aspf-d4{0%{opacity:0}31%{opacity:1}56%{opacity:0}}
    @keyframes aspf-l1{0%,6%{opacity:.35;color:var(--text-secondary)}10%,54%{opacity:1;color:var(--text-primary)}58%,100%{opacity:.35;color:var(--text-secondary)}}
    @keyframes aspf-l2{0%,58%{opacity:.35;color:var(--text-secondary)}62%,92%{opacity:1;color:var(--text-primary)}96%,100%{opacity:.35;color:var(--text-secondary)}}
  </style>
</div>
