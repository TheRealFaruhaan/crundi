<div class="wna a-brdh">
  <div class="panel">
    <div class="url"><span class="typed"></span></div>
    <div class="list"><i class="r r1"></i><i class="r r2"></i><i class="r r3"></i><i class="r r4"></i></div>
    <div class="clr"><span class="ck c1"></span><span class="ck c2"></span><span class="ck c3"></span><span class="go"></span></div>
  </div>
  <style>
    .a-brdh{position:absolute;inset:0;font-family:system-ui,sans-serif}
    .a-brdh .panel{position:absolute;left:150px;top:40px;width:340px;height:320px;border-radius:12px;background:var(--bg-secondary);border:1px solid var(--border);overflow:hidden}
    .a-brdh .url{margin:16px;height:30px;border-radius:15px;background:var(--bg-primary);border:1px solid var(--accent);position:relative}
    .a-brdh .typed{position:absolute;left:14px;top:11px;height:8px;border-radius:4px;background:var(--text-secondary);width:0;animation:abrdh-t 10s steps(6) infinite}
    .a-brdh .list{margin:0 16px}
    .a-brdh .r{display:block;height:34px;margin-bottom:8px;border-radius:7px;background:var(--bg-card);border:1px solid var(--border);opacity:0;animation:abrdh-r 10s ease infinite}
    .a-brdh .r1{animation-delay:.2s}.a-brdh .r2{animation-delay:.4s}.a-brdh .r3{animation-delay:.6s}.a-brdh .r4{animation-delay:.8s}
    .a-brdh .clr{position:absolute;left:16px;right:16px;bottom:16px;height:44px;display:flex;gap:10px;align-items:center;opacity:0;animation:abrdh-c 10s ease infinite}
    .a-brdh .ck{width:16px;height:16px;border-radius:4px;background:var(--accent)}
    .a-brdh .go{margin-left:auto;width:70px;height:28px;border-radius:6px;background:var(--red,#ef4444)}
    @keyframes abrdh-t{0%,5%{width:0}30%,100%{width:120px}}
    @keyframes abrdh-r{0%,25%{opacity:0;transform:translateY(6px)}35%,62%{opacity:1;transform:none}72%,100%{opacity:0}}
    @keyframes abrdh-c{0%,62%{opacity:0}70%,92%{opacity:1}100%{opacity:0}}
  </style>
</div>
