<div class="wna a-hpa">
  <div class="chat"><span class="lbl">A chat</span><i class="b b1"></i><i class="b b2"></i><div class="ask">may I use Home?</div></div>
  <div class="card"><span class="lbl">You</span><div class="row">Home network</div><div class="btn ok">Approve</div><div class="btn no">Refuse</div></div>
  <div class="sw"><i></i></div>
  <style>
    .a-hpa{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary)}
    .a-hpa .chat,.a-hpa .card{position:absolute;top:80px;width:220px;height:200px;border-radius:12px;background:var(--bg-secondary);border:1px solid var(--border)}
    .a-hpa .chat{left:50px}.a-hpa .card{right:50px}
    .a-hpa .lbl{position:absolute;top:-22px;left:0;font-size:13px;color:var(--text-secondary)}
    .a-hpa .b{position:absolute;left:16px;height:10px;border-radius:5px;background:var(--text-muted)}
    .a-hpa .b1{top:22px;width:150px}.a-hpa .b2{top:42px;width:110px}
    .a-hpa .ask{position:absolute;left:16px;right:16px;top:80px;height:36px;border-radius:8px;background:var(--accent-dim);border:1px solid var(--accent);font-size:12px;line-height:36px;text-align:center;opacity:0;animation:ahpa-a 10s ease infinite}
    .a-hpa .row{position:absolute;left:16px;right:16px;top:22px;height:32px;border-radius:7px;background:var(--bg-card);border:1px solid var(--border);font-size:12px;line-height:32px;padding-left:10px;opacity:0;animation:ahpa-r 10s ease infinite}
    .a-hpa .btn{position:absolute;top:72px;width:88px;height:30px;border-radius:7px;font-size:12px;line-height:30px;text-align:center;opacity:0;animation:ahpa-r 10s ease infinite}
    .a-hpa .ok{left:16px;background:var(--green);color:#fff;animation:ahpa-ok 10s ease infinite}.a-hpa .no{right:16px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary)}
    .a-hpa .sw{position:absolute;right:120px;top:300px;width:60px;height:32px;border-radius:16px;background:var(--bg-card);border:1px solid var(--border);animation:ahpa-s 10s ease infinite}
    .a-hpa .sw i{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--text-muted);animation:ahpa-k 10s ease infinite}
    @keyframes ahpa-a{0%,8%{opacity:0;transform:translateY(8px)}15%,95%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes ahpa-r{0%,18%{opacity:0}25%,95%{opacity:1}100%{opacity:0}}
    @keyframes ahpa-ok{0%,18%{opacity:0}25%,38%{opacity:1;transform:none}42%{transform:scale(.92)}46%,95%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes ahpa-s{0%,45%{background:var(--bg-card);border-color:var(--border)}50%,78%{background:var(--yellow-dim);border-color:var(--green)}84%,100%{background:var(--bg-card);border-color:var(--border)}}
    @keyframes ahpa-k{0%,45%{left:4px;background:var(--text-muted)}50%,78%{left:32px;background:var(--green)}84%,100%{left:4px;background:var(--text-muted)}}
  </style>
</div>
