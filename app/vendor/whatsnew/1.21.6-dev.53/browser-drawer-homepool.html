<div class="wna a-brdp">
  <div class="tab"><b>HP</b><i></i></div>
  <div class="pill"><span class="ok">via home phone</span><span class="no">No exit is up</span></div>
  <div class="srv"></div>
  <div class="node n1"></div>
  <div class="line l1"><i class="d"></i></div>
  <div class="line l2"><i class="d"></i></div>
  <style>
    .a-brdp{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary)}
    .a-brdp .tab{position:absolute;left:60px;top:80px;width:180px;height:34px;border-radius:8px;background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 10px;box-sizing:border-box}
    .a-brdp .tab b{font-size:10px;padding:2px 5px;border-radius:3px;color:#fff;background:#059669;animation:abrdp-b 10s step-end infinite}
    .a-brdp .tab i{flex:1;height:8px;border-radius:4px;background:var(--text-muted)}
    .a-brdp .pill{position:absolute;left:60px;top:126px;height:24px;font-size:12px}
    .a-brdp .pill span{position:absolute;white-space:nowrap;padding:3px 10px;border-radius:12px}
    .a-brdp .ok{border:1px solid #059669;animation:abrdp-o 10s step-end infinite}
    .a-brdp .no{border:1px solid var(--red,#ef4444);color:var(--red,#ef4444);opacity:0;animation:abrdp-x 10s step-end infinite}
    .a-brdp .srv{position:absolute;left:290px;top:180px;width:70px;height:70px;border-radius:12px;background:var(--bg-secondary);border:1px solid var(--border)}
    .a-brdp .node{position:absolute;left:470px;top:280px;width:60px;height:90px;border-radius:12px;background:var(--bg-secondary);border:2px solid #059669;animation:abrdp-n 10s step-end infinite}
    .a-brdp .line{position:absolute;height:4px;background:var(--border);transform-origin:0 50%}
    .a-brdp .l1{left:150px;top:150px;width:180px;transform:rotate(25deg)}
    .a-brdp .l2{left:350px;top:230px;width:150px;transform:rotate(38deg)}
    .a-brdp .d{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:#10b981;animation:abrdp-d 10s linear infinite}
    @keyframes abrdp-d{0%{left:0;opacity:1}25%{left:100%;opacity:1}26%,30%{left:0;opacity:0}31%{opacity:1;left:0}55%{left:100%;opacity:1}56%,100%{opacity:0}}
    @keyframes abrdp-b{0%{background:#059669}62%{background:var(--red,#ef4444)}96%{background:#059669}}
    @keyframes abrdp-o{0%{opacity:1}62%{opacity:0}96%{opacity:1}}
    @keyframes abrdp-x{0%{opacity:0}62%{opacity:1}96%{opacity:0}}
    @keyframes abrdp-n{0%{opacity:1}60%{opacity:.25}96%{opacity:1}}
  </style>
</div>
