<div class="wna a-brdn">
  <div class="pc"><span class="lbl">This PC</span><div class="tab"><b>SRV</b><i></i></div></div>
  <div class="srv"><span class="lbl">Server</span><div class="dev">localhost:4300</div></div>
  <div class="pipe"><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i></div>
  <div class="lock"></div>
  <style>
    .a-brdn{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary)}
    .a-brdn .pc,.a-brdn .srv{position:absolute;top:110px;width:170px;height:180px;border-radius:12px;background:var(--bg-secondary);border:1px solid var(--border)}
    .a-brdn .pc{left:50px}.a-brdn .srv{right:50px}
    .a-brdn .lbl{position:absolute;top:-24px;left:0;font-size:13px;color:var(--text-secondary)}
    .a-brdn .tab{position:absolute;left:16px;top:20px;right:16px;height:30px;border-radius:7px;background:var(--bg-card);border:1px solid var(--accent);display:flex;align-items:center;gap:8px;padding:0 8px}
    .a-brdn .tab b{font-size:10px;padding:2px 5px;border-radius:3px;background:var(--accent);color:#fff}
    .a-brdn .tab i{flex:1;height:8px;border-radius:4px;background:var(--text-muted)}
    .a-brdn .dev{position:absolute;left:16px;right:16px;top:70px;height:44px;border-radius:8px;background:var(--bg-card);border:1px solid var(--border);font:12px/44px var(--mono);text-align:center;color:var(--text-secondary);animation:abrdn-g 9s ease infinite}
    .a-brdn .pipe{position:absolute;left:220px;right:220px;top:193px;height:6px;border-radius:3px;background:var(--border)}
    .a-brdn .dot{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);opacity:0;animation:abrdn-d 9s linear infinite}
    .a-brdn .d2{animation-delay:.6s}.a-brdn .d3{animation-delay:1.2s}
    .a-brdn .lock{position:absolute;left:308px;top:160px;width:24px;height:18px;border-radius:4px;background:var(--green)}
    .a-brdn .lock:before{content:"";position:absolute;left:5px;top:-10px;width:10px;height:10px;border:3px solid var(--green);border-bottom:none;border-radius:8px 8px 0 0}
    @keyframes abrdn-d{0%{left:0;opacity:0}5%{opacity:1}40%{left:100%;opacity:1}45%,100%{left:100%;opacity:0}}
    @keyframes abrdn-g{0%,30%{border-color:var(--border);color:var(--text-secondary)}38%,90%{border-color:var(--green);color:var(--text-primary)}100%{border-color:var(--border)}}
  </style>
</div>
