<div class="wna a-cdrp">
  <div class="win">
    <div class="me">Check the builds</div>
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="q"><span>and the logs too</span><b>&times;</b></div>
  </div>
  <style>
    .a-cdrp{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:13px}
    .a-cdrp .win{position:absolute;left:150px;top:50px;width:340px;height:300px;border-radius:16px;background:var(--bg-secondary);border:1px solid var(--border)}
    .a-cdrp .me{position:absolute;right:16px;top:30px;padding:9px 13px;border-radius:14px 14px 4px 14px;background:var(--accent-dim);border:1px solid var(--accent)}
    .a-cdrp .dots{position:absolute;left:16px;top:90px;display:flex;gap:6px;padding:12px 14px;border-radius:14px 14px 14px 4px;background:var(--bg-card);border:1px solid var(--border)}
    .a-cdrp .dots i{width:7px;height:7px;border-radius:50%;background:var(--text-secondary);animation:acdrp-d 1s ease-in-out infinite}.a-cdrp .dots i:nth-child(2){animation-delay:.2s}.a-cdrp .dots i:nth-child(3){animation-delay:.4s}
    .a-cdrp .q{position:absolute;right:16px;top:150px;display:flex;align-items:center;gap:8px;animation:acdrp-q 9s ease infinite}
    .a-cdrp .q span{padding:9px 13px;border-radius:14px 14px 4px 14px;background:var(--accent-dim);border:1px solid var(--accent);opacity:.6;font-style:italic}
    .a-cdrp .q b{width:22px;height:22px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-weight:400;animation:acdrp-x 9s ease infinite}
    @keyframes acdrp-d{0%,60%,100%{opacity:.35}30%{opacity:1}}
    @keyframes acdrp-q{0%,10%{opacity:0}16%,58%{opacity:1;transform:none}66%,100%{opacity:0;transform:translateX(20px)}}
    @keyframes acdrp-x{0%,46%{border-color:var(--border)}50%,58%{border-color:var(--accent);transform:scale(.9)}}
  </style>
</div>
