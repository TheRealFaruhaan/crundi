<div class="wna a-cgal">
  <div class="view">
    <div class="strip"><i class="p1"></i><i class="p2"></i><i class="p3"></i></div>
    <span class="cnt">1 / 3</span><span class="cnt c2">2 / 3</span><span class="cnt c3">3 / 3</span>
    <span class="side l"></span><span class="side r"></span>
  </div>
  <style>
    .a-cgal{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary)}
    .a-cgal .view{position:absolute;left:120px;top:40px;width:400px;height:320px;border-radius:14px;background:#000;border:1px solid var(--border);overflow:hidden}
    .a-cgal .strip{position:absolute;top:50px;left:0;width:1200px;height:220px;display:flex;animation:acgal-s 9s ease infinite}
    .a-cgal .strip i{display:block;width:280px;height:200px;margin:0 60px;border-radius:10px}
    .a-cgal .p1{background:linear-gradient(135deg,var(--accent),var(--accent-hover))}.a-cgal .p2{background:linear-gradient(135deg,var(--green),var(--accent-dim))}.a-cgal .p3{background:linear-gradient(135deg,var(--yellow),var(--yellow-dim))}
    .a-cgal .cnt{position:absolute;top:12px;left:12px;padding:3px 9px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border);font:600 11px var(--mono);color:var(--text-secondary);opacity:0;animation:acgal-1 9s step-end infinite}
    .a-cgal .c2{animation-name:acgal-2}.a-cgal .c3{animation-name:acgal-3}
    .a-cgal .side{position:absolute;top:145px;width:30px;height:30px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border)}.a-cgal .l{left:10px}.a-cgal .r{right:10px}
    @keyframes acgal-s{0%,25%{transform:translateX(0)}33%,58%{transform:translateX(-400px)}66%,92%{transform:translateX(-800px)}100%{transform:translateX(0)}}
    @keyframes acgal-1{0%{opacity:1}30%{opacity:0}96%{opacity:1}}
    @keyframes acgal-2{0%{opacity:0}30%{opacity:1}63%{opacity:0}}
    @keyframes acgal-3{0%{opacity:0}63%{opacity:1}96%{opacity:0}}
  </style>
</div>
