<div class="wna a-cmut">
  <div class="win">
    <div class="menu"><span class="it">Voice view</span><span class="it on">Mute Cru's voice</span></div>
    <div class="bub">Two services are running, Sir.</div>
    <span class="spk"></span>
  </div>
  <style>
    .a-cmut{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:13px}
    .a-cmut .win{position:absolute;left:150px;top:50px;width:340px;height:300px;border-radius:16px;background:var(--bg-secondary);border:1px solid var(--border)}
    .a-cmut .menu{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border);animation:acmut-m 9s ease infinite}
