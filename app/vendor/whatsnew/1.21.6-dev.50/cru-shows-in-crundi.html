<div class="wna a-csc">
  <div class="app">
    <div class="tabs"><span class="t1">Workbench</span><span class="t2">Kanban</span><span>Files</span><span>Settings</span></div>
    <div class="work"><i></i><i></i><i></i></div>
    <div class="board">
      <div class="col"><div class="h">Backlog</div><div class="c"></div><div class="c target"></div><div class="c"></div></div>
      <div class="col"><div class="h">To do</div><div class="c"></div></div>
      <div class="col"><div class="h">Done</div><div class="c"></div><div class="c"></div></div>
    </div>
    <div class="ring"></div>
    <div class="note"><b>Cru</b> Here it is</div>
  </div>
  <div class="cru">
    <div class="me">Show me the voice tour card</div>
    <div class="you">It's on your board, in Backlog.</div>
  </div>
  <style>
    .a-csc{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:13px}
    .a-csc .app{position:absolute;left:28px;top:36px;width:420px;height:328px;border-radius:14px;background:var(--bg-secondary);border:1px solid var(--border);overflow:hidden}
    .a-csc .tabs{display:flex;gap:14px;padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text-secondary);font-size:12px}
    .a-csc .tabs span{padding-bottom:3px;border-bottom:2px solid transparent}
    .a-csc .t1{animation:acsc-t1 10s ease infinite}
    .a-csc .t2{animation:acsc-t2 10s ease infinite}
    .a-csc .work{position:absolute;left:14px;right:14px;top:56px;bottom:14px;display:flex;flex-direction:column;gap:10px;animation:acsc-w 10s ease infinite}
    .a-csc .work i{display:block;height:60px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border)}
    .a-csc .board{position:absolute;left:14px;right:14px;top:56px;bottom:14px;display:flex;gap:10px;opacity:0;animation:acsc-b 10s ease infinite}
    .a-csc .col{flex:1;display:flex;flex-direction:column;gap:8px}
    .a-csc .h{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
    .a-csc .c{height:40px;border-radius:9px;background:var(--bg-card);border:1px solid var(--border)}
    .a-csc .ring{position:absolute;left:10px;top:122px;width:130px;height:48px;border-radius:12px;border:2px solid var(--accent-hover);box-shadow:0 0 0 4px var(--accent-dim),0 0 24px 6px var(--accent-dim);opacity:0;animation:acsc-r 10s ease infinite}
    .a-csc .note{position:absolute;left:12px;top:182px;padding:6px 10px;border-radius:10px;background:var(--bg-card);border:1px solid var(--accent);font-size:12px;opacity:0;animation:acsc-n 10s ease infinite}
    .a-csc .note b{color:var(--accent-hover);margin-right:4px}
    .a-csc .cru{position:absolute;right:24px;top:56px;width:180px;height:200px;border-radius:14px;background:var(--bg-primary);border:1px solid var(--border);box-shadow:0 14px 40px rgba(0,0,0,.45)}
    .a-csc .me{position:absolute;right:10px;top:14px;max-width:150px;padding:7px 10px;border-radius:12px 12px 4px 12px;background:var(--accent-dim);border:1px solid var(--accent);font-size:12px;opacity:0;animation:acsc-m 10s ease infinite}
    .a-csc .you{position:absolute;left:10px;top:84px;max-width:150px;padding:7px 10px;border-radius:12px 12px 12px 4px;background:var(--bg-card);border:1px solid var(--border);font-size:12px;opacity:0;animation:acsc-y 10s ease infinite}
    @keyframes acsc-m{0%,4%{opacity:0;transform:translateY(6px)}10%,94%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes acsc-t1{0%,27%{color:var(--text-primary);border-color:var(--accent)}31%,100%{color:var(--text-secondary);border-color:transparent}}
    @keyframes acsc-t2{0%,27%{color:var(--text-secondary);border-color:transparent}31%,96%{color:var(--text-primary);border-color:var(--accent)}100%{color:var(--text-secondary);border-color:transparent}}
    @keyframes acsc-w{0%,27%{opacity:1}31%,96%{opacity:0}100%{opacity:1}}
    @keyframes acsc-b{0%,27%{opacity:0}31%,96%{opacity:1}100%{opacity:0}}
    @keyframes acsc-r{0%,38%{opacity:0;transform:scale(1.08)}44%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
    @keyframes acsc-n{0%,44%{opacity:0;transform:translateY(4px)}50%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
    @keyframes acsc-y{0%,50%{opacity:0;transform:translateY(6px)}56%,94%{opacity:1;transform:none}100%{opacity:0}}
  </style>
</div>
