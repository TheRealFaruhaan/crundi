<div class="wna a-cfb">
  <div class="win">
    <div class="panel"><span class="h"></span><span class="ex"></span><div class="tiles"><i></i><i></i><i></i><i></i></div></div>
  </div>
  <style>
    .a-cfb{position:absolute;inset:0;font-family:system-ui,sans-serif}
    .a-cfb .win{position:absolute;left:190px;top:30px;width:260px;height:340px;border-radius:18px;background:var(--bg-secondary);border:1px solid var(--border);overflow:hidden}
    .a-cfb .panel{position:absolute;left:12px;right:12px;top:50px;height:110px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);animation:acfb-p 9s ease infinite}
    .a-cfb .h{position:absolute;left:10px;top:8px;width:70px;height:8px;border-radius:4px;background:var(--text-muted)}
    .a-cfb .ex{position:absolute;right:8px;top:4px;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--text-secondary);animation:acfb-e 9s ease infinite}
    .a-cfb .tiles{position:absolute;inset:26px 8px 8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .a-cfb .tiles i{border-radius:6px;background:var(--accent-dim)}.a-cfb .tiles i:nth-child(2){background:var(--green);opacity:.5}
    @keyframes acfb-p{0%,30%{height:110px}40%,85%{height:270px}95%,100%{height:110px}}
    @keyframes acfb-e{0%,22%{border-color:var(--text-secondary)}26%,32%{border-color:var(--accent);transform:scale(.85)}40%,100%{opacity:0}}
  </style>
</div>
