<div class="wna a-sph">
  <div class="card">
    <div class="h"><span class="lk"></span>DEPLOY_TOKEN <span class="old">Old PIN</span><span class="new">Passphrase</span></div>
    <div class="row"><span class="lbl">PIN</span><span class="f pin">&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;</span><span class="btn ok">Approve</span></div>
    <div class="up">
      <div class="t">This secret uses an old 6-digit PIN. Set a new passphrase (8+ characters)</div>
      <div class="f pp"><span class="ty">blue-river-42</span><span class="cur"></span></div>
      <div class="f pp2"><span class="ty">blue-river-42</span></div>
      <div class="acts"><span class="btn ghost">Not now</span><span class="btn ok u">Update</span></div>
    </div>
    <div class="done"><span class="ck"></span>Re-locked with a passphrase</div>
  </div>
  <style>
    .a-sph{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:12.5px}
    .a-sph .card{position:absolute;left:110px;right:110px;top:36px;padding:16px 18px;border-radius:12px;background:var(--bg-card);border:1px solid var(--accent)}
    .a-sph .h{display:flex;align-items:center;gap:8px;font-family:ui-monospace,monospace;font-weight:600}
    .a-sph .lk{width:10px;height:8px;border:2px solid var(--accent);border-radius:2px;position:relative;top:2px}
    .a-sph .lk:before{content:'';position:absolute;left:1px;top:-7px;width:6px;height:6px;border:2px solid var(--accent);border-bottom:none;border-radius:4px 4px 0 0}
    .a-sph .old,.a-sph .new{font-family:system-ui,sans-serif;font-size:10.5px;padding:2px 7px;border-radius:9px;font-weight:500}
    .a-sph .old{border:1px solid var(--yellow);color:var(--yellow);animation:asph-old 11s infinite}
    .a-sph .new{border:1px solid var(--green);color:var(--green);opacity:0;margin-left:-62px;animation:asph-new 11s infinite}
    .a-sph .row{display:flex;align-items:center;gap:8px;margin-top:12px}
    .a-sph .lbl{color:var(--text-muted);font-size:11px;width:30px}
    .a-sph .f{flex:1;padding:7px 10px;border-radius:7px;background:var(--bg-primary);border:1px solid var(--border);font-family:ui-monospace,monospace;color:var(--text-secondary);overflow:hidden;white-space:nowrap}
    .a-sph .btn{padding:7px 13px;border-radius:7px;font-size:12px;border:1px solid var(--border);color:var(--text-secondary)}
    .a-sph .btn.ok{background:var(--accent);border-color:var(--accent);color:#fff}
    .a-sph .row .ok{animation:asph-press 11s infinite}
    .a-sph .up{margin-top:12px;display:flex;flex-direction:column;gap:7px;opacity:0;max-height:0;overflow:hidden;animation:asph-up 11s infinite}
    .a-sph .up .t{color:var(--text-secondary);font-size:11.5px}
    .a-sph .ty{display:inline-block;overflow:hidden;width:0;vertical-align:bottom;color:var(--text-primary);animation:asph-type 11s steps(13) infinite}
    .a-sph .pp2 .ty{animation-name:asph-type2}
    .a-sph .acts{display:flex;justify-content:flex-end;gap:8px}
    .a-sph .u{animation:asph-press2 11s infinite}
    .a-sph .done{margin-top:12px;display:flex;align-items:center;gap:8px;color:var(--green);opacity:0;animation:asph-done 11s infinite}
    .a-sph .ck{width:12px;height:6px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg);margin-top:-4px}
    @keyframes asph-press{0%,14%,19%,100%{filter:none}16%{filter:brightness(1.4)}}
    @keyframes asph-up{0%,20%{opacity:0;max-height:0}26%,74%{opacity:1;max-height:160px}80%,100%{opacity:0;max-height:0}}
    @keyframes asph-type{0%,30%{width:0}44%,100%{width:13ch}}
    @keyframes asph-type2{0%,46%{width:0}60%,100%{width:13ch}}
    @keyframes asph-press2{0%,66%,71%,100%{filter:none}68%{filter:brightness(1.4)}}
    @keyframes asph-done{0%,78%{opacity:0}82%,94%{opacity:1}100%{opacity:0}}
    @keyframes asph-old{0%,76%{opacity:1}80%,100%{opacity:0}}
    @keyframes asph-new{0%,78%{opacity:0}82%,94%{opacity:1}100%{opacity:0}}
  </style>
</div>
