<div class="wna a-ars">
  <div class="phone">
    <div class="scr">
      <div class="glow"></div>
      <div class="ring r1"></div><div class="ring r2"></div>
      <div class="bell"><i class="kn"></i><i class="dm"></i><i class="lp"></i><i class="cl"></i></div>
      <div class="tag">URGENT ALERT</div>
      <div class="t">web-1 is down</div>
      <div class="track"><span>Dismiss</span><span>Attend</span><div class="thumb"></div></div>
      <div class="sl">Snooze</div>
      <div class="chips"><span>5 min</span><span class="pk">15 min</span><span>30 min</span><span>1 hour</span></div>
      <div class="tap"></div>
      <div class="done"><b>Snoozed</b><span>rings again in 15 min</span></div>
    </div>
  </div>
  <div class="chat">
    <div class="hd"><span class="dot"></span>deploy chat</div>
    <div class="tool"><span class="w">alert_user</span> &rarr; <span class="v">snoozed, 15 min</span></div>
    <div class="msg"><b>Claude</b>Got it, I'll carry on and check back.</div>
  </div>
  <style>
    .a-ars{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary)}
    .a-ars .phone{position:absolute;left:60px;top:24px;width:200px;height:352px;border-radius:28px;border:2px solid var(--border);background:var(--bg-secondary);padding:9px;box-sizing:border-box}
    .a-ars .scr{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:var(--bg-primary)}
    .a-ars .glow{position:absolute;inset:-20px;background:radial-gradient(circle at 50% 22%,rgba(239,68,68,.42),rgba(99,102,241,.26) 42%,transparent 72%);animation:aars-glow 11s ease infinite}
    .a-ars .bell{position:absolute;left:50%;top:52px;width:40px;height:46px;margin-left:-20px;transform-origin:50% 2px;animation:aars-bell 11s ease-in-out infinite}
    .a-ars .bell i{position:absolute;display:block;background:var(--text-primary)}
    .a-ars .bell .kn{left:17px;top:0;width:6px;height:6px;border-radius:3px}
    .a-ars .bell .dm{left:6px;top:4px;width:28px;height:28px;border-radius:14px 14px 4px 4px}
    .a-ars .bell .lp{left:1px;top:30px;width:38px;height:5px;border-radius:3px}
    .a-ars .bell .cl{left:16px;top:37px;width:8px;height:8px;border-radius:50%}
    .a-ars .ring{position:absolute;left:50%;top:74px;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid #ef4444;opacity:0}
    .a-ars .r1{animation:aars-ring 11s ease-out infinite}
    .a-ars .r2{border-color:var(--accent);animation:aars-ring2 11s ease-out infinite}
    .a-ars .tag{position:absolute;left:0;right:0;top:122px;text-align:center;font-family:var(--mono,ui-monospace,monospace);font-size:9px;letter-spacing:.06em;color:#ef4444}
    .a-ars .t{position:absolute;left:0;right:0;top:138px;text-align:center;font-size:15px;font-weight:600}
    .a-ars .track{position:absolute;left:14px;right:14px;top:186px;height:36px;border-radius:18px;background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 11px;box-sizing:border-box;font-size:9.5px;color:var(--text-secondary)}
    .a-ars .thumb{position:absolute;left:50%;top:3px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--text-primary)}
    .a-ars .sl{position:absolute;left:0;right:0;top:248px;text-align:center;font-size:9.5px;color:var(--text-muted);letter-spacing:.04em}
    .a-ars .chips{position:absolute;left:8px;right:8px;top:266px;display:flex;justify-content:space-between}
    .a-ars .chips span{padding:5px 0;width:38px;text-align:center;border-radius:11px;border:1px solid var(--border);background:var(--bg-card);font-size:8.5px;color:var(--text-secondary);white-space:nowrap}
    .a-ars .chips .pk{animation:aars-pk 11s ease infinite}
    .a-ars .tap{position:absolute;left:53px;top:264px;width:30px;height:30px;margin:-3px 0 0 0;border-radius:50%;background:rgba(255,255,255,.28);opacity:0;animation:aars-tap 11s ease infinite}
    .a-ars .done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg-primary);opacity:0;animation:aars-done 11s ease infinite}
    .a-ars .done b{font-size:15px}
    .a-ars .done span{font-size:10.5px;color:var(--text-secondary)}
    .a-ars .chat{position:absolute;left:296px;right:32px;top:112px;display:flex;flex-direction:column;gap:10px;font-size:12.5px}
    .a-ars .hd{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--text-secondary);font-size:12px;opacity:0;animation:aars-a 11s ease infinite}
    .a-ars .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .a-ars .tool{padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg-card);font-family:var(--mono,ui-monospace,monospace);font-size:11.5px;color:var(--text-secondary);opacity:0;animation:aars-b 11s ease infinite}
    .a-ars .tool .w{color:var(--accent)}
    .a-ars .tool .v{color:var(--yellow)}
    .a-ars .msg{padding:10px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);opacity:0;animation:aars-c 11s ease infinite}
    .a-ars .msg b{display:block;font-size:10.5px;color:var(--text-muted);font-weight:600;margin-bottom:4px}
    @keyframes aars-glow{0%,40%{opacity:1}48%,100%{opacity:.25}}
    @keyframes aars-bell{0%,4%{transform:none}8%{transform:rotate(14deg)}12%{transform:rotate(-14deg)}16%{transform:rotate(12deg)}20%{transform:rotate(-12deg)}24%{transform:rotate(10deg)}28%{transform:rotate(-10deg)}32%{transform:rotate(8deg)}36%,100%{transform:none}}
    @keyframes aars-ring{0%,4%{opacity:0;transform:scale(.6)}7%{opacity:.85}18%{opacity:0;transform:scale(2.3)}19%{opacity:0;transform:scale(.6)}22%{opacity:.85}33%,100%{opacity:0;transform:scale(2.3)}}
    @keyframes aars-ring2{0%,11%{opacity:0;transform:scale(.6)}14%{opacity:.7}25%{opacity:0;transform:scale(2.3)}26%{opacity:0;transform:scale(.6)}29%{opacity:.7}40%,100%{opacity:0;transform:scale(2.3)}}
    @keyframes aars-tap{0%,36%{opacity:0;transform:scale(.4)}39%{opacity:1;transform:scale(1)}44%,100%{opacity:0;transform:scale(1.5)}}
    @keyframes aars-pk{0%,38%{background:var(--bg-card);color:var(--text-secondary);border-color:var(--border)}40%,100%{background:var(--accent);color:#fff;border-color:var(--accent)}}
    @keyframes aars-done{0%,46%{opacity:0}51%,92%{opacity:1}100%{opacity:0}}
    @keyframes aars-a{0%,4%{opacity:0;transform:translateY(6px)}9%,92%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes aars-b{0%,50%{opacity:0;transform:translateX(-10px)}55%,92%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes aars-c{0%,64%{opacity:0;transform:translateY(6px)}70%,92%{opacity:1;transform:none}100%{opacity:0}}
  </style>
</div>
