<div class="wna a-csp">
  <div class="win">
    <div class="hd">
      <span class="dot"></span><span class="nm">deploy chat</span>
      <span class="pill">2 allowed</span>
      <span class="lock"><i class="sh"></i><i class="bd"></i><i class="tp t1"></i></span>
    </div>
    <div class="u">Deploy to staging, please</div>
    <div class="c">On it. Building the release first.</div>
    <div class="run"><div><span class="w">secret_run</span> DEPLOY_TOKEN &rarr; <span class="ok">ran, nothing asked</span></div><div class="vl">value <span>&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span></div></div>
    <div class="dlg">
      <div class="ti">Allow for this chat</div>
      <div class="row"><span class="cb k1"><i></i></span>DEPLOY_TOKEN</div>
      <div class="row"><span class="cb k2"><i></i></span>STAGING_DB</div>
      <div class="chips"><span>15 min</span><span class="pk">1 hour<i class="tp t2"></i></span><span>8 hours</span><span>Until chat ends</span></div>
      <div class="pin"><span class="lb">Passphrase</span><i class="d d1"></i><i class="d d2"></i><i class="d d3"></i><i class="d d4"></i><span class="btn">Allow<i class="tp t3"></i></span></div>
    </div>
  </div>
  <style>
    .a-csp{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:12.5px}
    .a-csp .win{position:absolute;left:40px;right:40px;top:54px;bottom:54px;border-radius:12px;border:1px solid var(--border);background:var(--bg-secondary);overflow:hidden}
    .a-csp .hd{position:absolute;left:0;right:0;top:0;height:46px;border-bottom:1px solid var(--border);background:var(--bg-card);display:flex;align-items:center;gap:8px;padding:0 16px;box-sizing:border-box}
    .a-csp .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .a-csp .nm{font-weight:600;flex:1}
    .a-csp .pill{font-size:10.5px;padding:3px 9px;border-radius:10px;background:var(--accent);color:#fff;opacity:0;transform:scale(.6);animation:acsp-pill 11s ease infinite}
    .a-csp .lock{position:relative;width:16px;height:20px;margin-left:4px}
    .a-csp .lock i{position:absolute;display:block}
    .a-csp .sh{left:3px;top:0;width:6px;height:9px;border:2px solid var(--text-secondary);border-bottom:none;border-radius:6px 6px 0 0;animation:acsp-shc 11s ease infinite}
    .a-csp .bd{left:0;top:8px;width:16px;height:12px;border-radius:3px;background:var(--text-secondary);animation:acsp-bdc 11s ease infinite}
    .a-csp .tp{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(255,255,255,.3);opacity:0;pointer-events:none}
    .a-csp .lock .tp{left:8px;top:10px}
    .a-csp .t1{animation:acsp-t1 11s ease infinite}
    .a-csp .t2{animation:acsp-t2 11s ease infinite}
    .a-csp .t3{animation:acsp-t3 11s ease infinite}
    .a-csp .u{position:absolute;right:18px;top:64px;padding:8px 12px;border-radius:10px;background:var(--accent);color:#fff}
    .a-csp .c{position:absolute;left:18px;top:106px;padding:8px 12px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary)}
    .a-csp .run{position:absolute;left:18px;top:152px;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg-card);font-family:var(--mono,ui-monospace,monospace);font-size:11.5px;color:var(--text-secondary);opacity:0;animation:acsp-run 11s ease infinite}
    .a-csp .run .w{color:var(--accent)}
    .a-csp .run .ok{color:var(--green)}
    .a-csp .run .vl{margin-top:5px;color:var(--text-muted)}
    .a-csp .run .vl span{letter-spacing:1px;color:var(--text-secondary)}
    .a-csp .dlg{position:absolute;right:12px;top:54px;width:310px;padding:14px 15px;box-sizing:border-box;border-radius:12px;border:1px solid var(--border);background:var(--bg-primary);box-shadow:0 12px 32px rgba(0,0,0,.45);opacity:0;transform:translateY(-8px) scale(.97);transform-origin:90% 0;animation:acsp-dlg 11s ease infinite}
    .a-csp .ti{font-weight:600;font-size:13px;margin-bottom:10px}
    .a-csp .row{display:flex;align-items:center;gap:9px;height:26px;font-family:var(--mono,ui-monospace,monospace);font-size:11.5px;color:var(--text-secondary)}
    .a-csp .cb{position:relative;width:13px;height:13px;border-radius:3px;border:1.5px solid var(--text-muted);box-sizing:border-box}
    .a-csp .cb i{position:absolute;left:3px;top:0;width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);opacity:0}
    .a-csp .k1{animation:acsp-k1 11s ease infinite}
    .a-csp .k1 i{animation:acsp-k1i 11s ease infinite}
    .a-csp .k2{animation:acsp-k2 11s ease infinite}
    .a-csp .k2 i{animation:acsp-k2i 11s ease infinite}
    .a-csp .chips{display:flex;gap:5px;margin:10px 0 12px}
    .a-csp .chips span{position:relative;padding:4px 8px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);font-size:10px;color:var(--text-secondary);white-space:nowrap}
    .a-csp .chips .pk{animation:acsp-pk 11s ease infinite}
    .a-csp .pin{display:flex;align-items:center;gap:8px}
    .a-csp .lb{font-size:10.5px;color:var(--text-muted);margin-right:4px}
    .a-csp .d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text-muted);box-sizing:border-box}
    .a-csp .d1{animation:acsp-d1 11s step-end infinite}
    .a-csp .d2{animation:acsp-d2 11s step-end infinite}
    .a-csp .d3{animation:acsp-d3 11s step-end infinite}
    .a-csp .d4{animation:acsp-d4 11s step-end infinite}
    .a-csp .btn{position:relative;margin-left:auto;padding:6px 14px;border-radius:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:600}
    @keyframes acsp-t1{0%,6%{opacity:0;transform:scale(.4)}9%{opacity:1;transform:scale(1)}14%,100%{opacity:0;transform:scale(1.5)}}
    @keyframes acsp-t2{0%,28%{opacity:0;transform:scale(.4)}31%{opacity:1;transform:scale(1)}36%,100%{opacity:0;transform:scale(1.5)}}
    @keyframes acsp-t3{0%,52%{opacity:0;transform:scale(.4)}55%{opacity:1;transform:scale(1)}60%,100%{opacity:0;transform:scale(1.5)}}
    @keyframes acsp-dlg{0%,10%{opacity:0;transform:translateY(-8px) scale(.97)}14%,56%{opacity:1;transform:none}60%,100%{opacity:0;transform:translateY(-8px) scale(.97)}}
    @keyframes acsp-k1{0%,18%{background:transparent;border-color:var(--text-muted)}20%,100%{background:var(--accent);border-color:var(--accent)}}
    @keyframes acsp-k1i{0%,18%{opacity:0}20%,100%{opacity:1}}
    @keyframes acsp-k2{0%,23%{background:transparent;border-color:var(--text-muted)}25%,100%{background:var(--accent);border-color:var(--accent)}}
    @keyframes acsp-k2i{0%,23%{opacity:0}25%,100%{opacity:1}}
    @keyframes acsp-pk{0%,30%{background:var(--bg-card);color:var(--text-secondary);border-color:var(--border)}32%,100%{background:var(--accent);color:#fff;border-color:var(--accent)}}
    @keyframes acsp-d1{0%{background:transparent}38%{background:var(--text-primary);border-color:var(--text-primary)}100%{background:transparent}}
    @keyframes acsp-d2{0%{background:transparent}42%{background:var(--text-primary);border-color:var(--text-primary)}100%{background:transparent}}
    @keyframes acsp-d3{0%{background:transparent}46%{background:var(--text-primary);border-color:var(--text-primary)}100%{background:transparent}}
    @keyframes acsp-d4{0%{background:transparent}50%{background:var(--text-primary);border-color:var(--text-primary)}100%{background:transparent}}
    @keyframes acsp-pill{0%,59%{opacity:0;transform:scale(.6)}63%,92%{opacity:1;transform:none}100%{opacity:0;transform:scale(.6)}}
    @keyframes acsp-shc{0%,59%{border-color:var(--text-secondary)}61%,92%{border-color:var(--accent)}100%{border-color:var(--text-secondary)}}
    @keyframes acsp-bdc{0%,59%{background:var(--text-secondary)}61%,92%{background:var(--accent)}100%{background:var(--text-secondary)}}
    @keyframes acsp-run{0%,68%{opacity:0;transform:translateY(6px)}74%,92%{opacity:1;transform:none}100%{opacity:0}}
  </style>
</div>
