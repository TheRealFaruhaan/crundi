<div class="wna a-brdp">
  <div class="win">
    <div class="bar"><i class="url"></i><span class="lock"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span></div>
    <div class="ask"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><i class="t1"></i><b class="save">Save</b></div>
    <div class="pg">
      <i class="h"></i>
      <div class="field"><i class="lbl"></i><span class="u"><i class="ut"></i></span></div>
      <div class="field f2"><i class="lbl"></i><span class="p"><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i></span></div>
      <i class="go"></i>
    </div>
  </div>
  <style>
    .a-brdp{position:absolute;inset:0;font-family:system-ui,sans-serif}
    .a-brdp .win{position:absolute;left:110px;top:30px;width:420px;height:340px;border-radius:10px;background:var(--bg-secondary);border:1px solid var(--border);overflow:hidden}
    .a-brdp .bar{position:absolute;left:0;right:0;top:0;height:40px;border-bottom:1px solid var(--border)}
    .a-brdp .url{position:absolute;left:12px;top:10px;width:330px;height:20px;border-radius:10px;background:var(--bg-primary);border:1px solid var(--border)}
    .a-brdp .lock{position:absolute;right:16px;top:9px;width:22px;height:22px;opacity:0;animation:abrdp-lock 10s ease infinite}
    .a-brdp svg{width:100%;height:100%;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .a-brdp .ask{position:absolute;left:0;right:0;top:40px;height:38px;background:var(--bg-card);border-bottom:1px solid var(--border);transform:translateY(-38px);opacity:0;animation:abrdp-ask 10s ease infinite}
    .a-brdp .ask svg{position:absolute;left:14px;top:10px;width:18px;height:18px}
    .a-brdp .t1{position:absolute;left:42px;top:15px;width:170px;height:8px;border-radius:4px;background:var(--text-muted)}
    .a-brdp .save{position:absolute;right:14px;top:7px;padding:4px 14px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:600}
    .a-brdp .pg{position:absolute;left:0;right:0;top:40px;bottom:0;background:#f4f4f8;animation:abrdp-pg 10s ease infinite}
    .a-brdp .h{position:absolute;left:110px;top:40px;width:200px;height:16px;border-radius:4px;background:#8b8ca3}
    .a-brdp .field{position:absolute;left:110px;top:80px;width:200px}
    .a-brdp .field.f2{top:140px}
    .a-brdp .lbl{display:block;width:70px;height:7px;border-radius:4px;background:#c9cad6;margin-bottom:6px}
    .a-brdp .u,.a-brdp .p{display:block;height:30px;border-radius:6px;background:#fff;border:1px solid #c9cad6;position:relative;overflow:hidden}
    .a-brdp .ut{position:absolute;left:10px;top:11px;height:8px;border-radius:4px;background:#5a5a78;width:0;animation:abrdp-ut 10s ease infinite}
    .a-brdp .p{display:flex;gap:5px;align-items:center;padding-left:10px}
    .a-brdp .d{width:7px;height:7px;border-radius:50%;background:#5a5a78;opacity:0;animation:abrdp-d 10s ease infinite}
    .a-brdp .go{position:absolute;left:110px;top:196px;width:200px;height:32px;border-radius:6px;background:var(--accent)}
    @keyframes abrdp-ut{0%,6%{width:0}14%,46%{width:90px}50%,62%{width:0}66%,100%{width:90px}}
    @keyframes abrdp-d{0%,14%{opacity:0}20%,46%{opacity:1}50%,62%{opacity:0}66%,100%{opacity:1}}
    @keyframes abrdp-pg{0%,24%{opacity:1}27%,31%{opacity:.35}34%,100%{opacity:1}}
    @keyframes abrdp-ask{0%,28%{transform:translateY(-38px);opacity:0}32%,42%{transform:none;opacity:1}46%,100%{transform:translateY(-38px);opacity:0}}
    @keyframes abrdp-lock{0%,44%{opacity:0;transform:scale(.6)}48%,94%{opacity:1;transform:none}100%{opacity:0}}
  </style>
</div>
