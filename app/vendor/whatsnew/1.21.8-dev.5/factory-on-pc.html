<div class="wna a-fp2">
  <div class="team"><div class="h">Team</div><div class="p"><span>Manager</span><i>this server</i></div><div class="p"><span>Builder</span><i class="pc">farhan-RP-15</i></div><div class="p"><span>Reviewer</span><i>this server</i></div></div>
  <div class="flow"><div class="n a">Plan</div><div class="ln"></div><div class="n b">Build <small>on PC</small></div><div class="ln"></div><div class="n c">Review</div></div>
  <style>
    .a-fp2{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:13px}
    .a-fp2 .team{position:absolute;left:40px;top:90px;width:220px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);padding:10px 12px}
    .a-fp2 .h{font-weight:600;margin-bottom:6px}
    .a-fp2 .p{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
    .a-fp2 .p:last-child{border-bottom:none}
    .a-fp2 i{font-style:normal;font-size:11px;color:var(--text-muted)}
    .a-fp2 i.pc{color:var(--accent)}
    .a-fp2 .flow{position:absolute;left:290px;top:140px;display:flex;align-items:center;gap:6px}
    .a-fp2 .n{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);display:flex;flex-direction:column;align-items:center}
    .a-fp2 .n small{font-size:10px;color:var(--accent)}
    .a-fp2 .ln{width:22px;height:2px;background:var(--border)}
    .a-fp2 .a{animation:afp2A 10s infinite}.a-fp2 .b{animation:afp2B 10s infinite}.a-fp2 .c{animation:afp2C 10s infinite}
    @keyframes afp2A{0%,8%{border-color:var(--border)}12%,30%{border-color:var(--accent)}34%,100%{border-color:var(--green)}}
    @keyframes afp2B{0%,34%{border-color:var(--border)}38%,66%{border-color:var(--accent)}70%,100%{border-color:var(--green)}}
    @keyframes afp2C{0%,70%{border-color:var(--border)}74%,92%{border-color:var(--accent)}96%,100%{border-color:var(--green)}}
  </style>
</div>
