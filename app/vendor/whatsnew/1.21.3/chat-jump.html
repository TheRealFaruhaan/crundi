<div class="wna a-cjp">
  <div class="win">
    <div class="log">
      <div class="m u">Why does the build fail on Windows?</div>
      <div class="m c">The release check runs a shell command that Windows does not have.</div>
      <div class="m u">Fix it and run the checks again</div>
      <div class="m c">Fixed. All checks pass on Linux and Windows.</div>
      <div class="m u">Tag it</div>
      <div class="m c">Tagged and pushed. The builds have started.</div>
    </div>
    <div class="btn"><span class="ar"></span><span class="dot"></span></div>
    <div class="tap"></div>
  </div>
  <style>
    .a-cjp{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:12.5px}
    .a-cjp .win{position:absolute;left:150px;right:150px;top:22px;bottom:22px;border-radius:16px;border:1px solid var(--border);background:var(--bg-secondary);overflow:hidden}
    .a-cjp .log{position:absolute;left:14px;right:14px;top:14px;display:flex;flex-direction:column;gap:12px;animation:acjp-log 10s ease infinite}
    .a-cjp .m{max-width:250px;padding:8px 11px;border-radius:12px;line-height:1.4}
    .a-cjp .u{align-self:flex-end;background:var(--accent-dim);border:1px solid var(--accent)}
    .a-cjp .c{color:var(--text-secondary)}
    .a-cjp .btn{position:absolute;left:50%;bottom:16px;width:40px;height:40px;margin-left:-20px;border-radius:50%;border:1px solid var(--accent);background:var(--bg-card);box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;animation:acjp-btn 10s cubic-bezier(.2,.9,.3,1.25) infinite}
    .a-cjp .ar{position:absolute;left:19px;top:11px;width:2px;height:16px;background:var(--text-primary);border-radius:1px;animation:acjp-nudge 10s ease infinite}
    .a-cjp .ar:after{content:'';position:absolute;left:-5px;bottom:0;width:8px;height:8px;border-right:2px solid var(--text-primary);border-bottom:2px solid var(--text-primary);transform:rotate(45deg);transform-origin:center}
    .a-cjp .dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-secondary);transform:scale(0);animation:acjp-dot 10s ease infinite}
    .a-cjp .tap{position:absolute;left:50%;bottom:22px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--accent);opacity:0;animation:acjp-tap 10s ease infinite}
    @keyframes acjp-log{0%,8%{transform:translateY(-150px)}24%,70%{transform:translateY(0)}80%,100%{transform:translateY(-150px)}}
    @keyframes acjp-btn{0%,24%{opacity:0;transform:translateY(14px) scale(.85)}30%,74%{opacity:1;transform:none}80%,100%{opacity:0;transform:translateY(14px) scale(.85)}}
    @keyframes acjp-dot{0%,40%{transform:scale(0)}44%,74%{transform:scale(1)}78%,100%{transform:scale(0)}}
    @keyframes acjp-nudge{0%,46%{transform:none}50%{transform:translateY(3px)}54%{transform:none}58%{transform:translateY(3px)}62%,100%{transform:none}}
    @keyframes acjp-tap{0%,68%{opacity:0;transform:scale(.4)}71%{opacity:.45;transform:scale(1)}76%,100%{opacity:0;transform:scale(1.5)}}
  </style>
</div>
