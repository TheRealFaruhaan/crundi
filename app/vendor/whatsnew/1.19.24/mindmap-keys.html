<div class="wna a-keys">
  <svg viewBox="0 0 640 400"><path d="M180,120 C230,120 220,76 270,76"/><path d="M180,120 C230,120 220,164 270,164"/><path d="M180,300 C230,300 220,256 270,256"/><path class="gone" d="M180,300 C230,300 220,344 270,344"/></svg>
