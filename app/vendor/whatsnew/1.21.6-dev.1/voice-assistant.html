<div class="wna a-vox">
  <div class="orb">
    <div class="glow"></div>
    <div class="ring">
      <i style="--a:0deg;--d:0s"></i><i style="--a:30deg;--d:.1s"></i><i style="--a:60deg;--d:.2s"></i><i style="--a:90deg;--d:.3s"></i>
      <i style="--a:120deg;--d:.4s"></i><i style="--a:150deg;--d:.5s"></i><i style="--a:180deg;--d:.6s"></i><i style="--a:210deg;--d:.5s"></i>
      <i style="--a:240deg;--d:.4s"></i><i style="--a:270deg;--d:.3s"></i><i style="--a:300deg;--d:.2s"></i><i style="--a:330deg;--d:.1s"></i>
    </div>
    <div class="comet"></div>
    <div class="core"></div>
  </div>
  <div class="said">"How much usage do I have left?"</div>
  <div class="reply">Plenty, Master. The five-hour window is at two percent.</div>
  <div class="pill"><span></span>Listening</div>
  <style>
    .a-vox{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary)}
    .a-vox .orb{position:absolute;left:50%;top:150px;width:170px;height:170px;margin:-85px 0 0 -85px}
    .a-vox .glow{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,var(--accent-dim),transparent 70%);animation:avox-glow 10s ease infinite}
    .a-vox .ring i{position:absolute;left:50%;top:50%;width:4px;height:26px;margin:-13px 0 0 -2px;border-radius:2px;background:var(--accent-hover);transform:rotate(var(--a)) translateY(-66px) scaleY(.3);transform-origin:50% 50%;opacity:.8;animation:avox-bar 10s ease infinite;animation-delay:var(--d)}
    .a-vox .core{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:radial-gradient(circle at 38% 34%,var(--accent-hover),var(--accent) 55%,var(--bg-card));animation:avox-core 10s ease infinite}
    .a-vox .comet{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent-hover);opacity:0;animation:avox-comet 10s linear infinite}
    .a-vox .said{position:absolute;left:0;right:0;top:262px;text-align:center;font-size:15px;color:var(--text-secondary);opacity:0;animation:avox-said 10s ease infinite}
    .a-vox .reply{position:absolute;left:90px;right:90px;top:296px;text-align:center;font-size:18px;font-weight:500;opacity:0;animation:avox-reply 10s ease infinite}
    .a-vox .pill{position:absolute;right:28px;top:22px;padding:5px 12px;border-radius:14px;border:1px solid var(--accent);background:var(--accent-dim);font-size:12px;color:var(--accent-hover);display:flex;align-items:center;gap:7px}
    .a-vox .pill span{width:7px;height:7px;border-radius:50%;background:var(--accent-hover);animation:avox-dot 1s ease infinite alternate}
    @keyframes avox-bar{0%,8%{transform:rotate(var(--a)) translateY(-66px) scaleY(.3)}12%{transform:rotate(var(--a)) translateY(-66px) scaleY(1.1)}16%{transform:rotate(var(--a)) translateY(-66px) scaleY(.5)}20%{transform:rotate(var(--a)) translateY(-66px) scaleY(1)}26%{transform:rotate(var(--a)) translateY(-66px) scaleY(.6)}30%,52%{transform:rotate(var(--a)) translateY(-66px) scaleY(.3)}58%{transform:rotate(var(--a)) translateY(-66px) scaleY(.9)}64%{transform:rotate(var(--a)) translateY(-66px) scaleY(.5)}70%{transform:rotate(var(--a)) translateY(-66px) scaleY(1)}78%{transform:rotate(var(--a)) translateY(-66px) scaleY(.4)}84%,100%{transform:rotate(var(--a)) translateY(-66px) scaleY(.3)}}
    @keyframes avox-core{0%,8%{transform:scale(.92)}14%,26%{transform:scale(1.06)}32%,50%{transform:scale(.95)}58%,78%{transform:scale(1.08)}86%,100%{transform:scale(.92)}}
    @keyframes avox-comet{0%,30%{opacity:0;transform:rotate(0)}34%{opacity:1}50%{opacity:1;transform:rotate(720deg)}54%,100%{opacity:0;transform:rotate(800deg)}}
    @keyframes avox-glow{0%,8%{opacity:.5}20%{opacity:1}34%,50%{opacity:.7}66%{opacity:1}90%,100%{opacity:.5}}
    @keyframes avox-said{0%,8%{opacity:0;transform:translateY(6px)}14%,88%{opacity:1;transform:none}94%,100%{opacity:0}}
    @keyframes avox-reply{0%,52%{opacity:0;transform:translateY(8px)}58%,88%{opacity:1;transform:none}94%,100%{opacity:0}}
    @keyframes avox-dot{from{opacity:.35}to{opacity:1}}
  </style>
</div>
