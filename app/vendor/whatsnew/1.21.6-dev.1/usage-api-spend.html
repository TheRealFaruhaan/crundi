<div class="wna a-uas">
  <div class="win">
    <div class="h">Claude usage over time</div>
    <div class="chart"><div class="line"></div></div>
    <div class="api">
      <div class="row"><b>Claude API · voice assistant</b><span class="amt">$0.42 of $50 this month</span></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="meta">Claude $0.38 · Deepgram $0.04 · 61 requests</div>
    </div>
  </div>
  <style>
    .a-uas{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary)}
    .a-uas .win{position:absolute;left:90px;right:90px;top:40px;bottom:40px;border-radius:14px;border:1px solid var(--border);background:var(--bg-secondary);padding:18px}
    .a-uas .h{font-size:15px;font-weight:600}
    .a-uas .chart{position:relative;height:120px;margin-top:14px;border-radius:8px;background:var(--bg-card);overflow:hidden}
    .a-uas .line{position:absolute;left:0;bottom:20px;height:60px;width:100%;background:linear-gradient(180deg,var(--accent-dim),transparent);clip-path:polygon(0 80%,15% 60%,30% 70%,45% 35%,60% 50%,75% 20%,90% 40%,100% 30%,100% 100%,0 100%)}
    .a-uas .api{margin-top:16px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card);opacity:0;transform:translateY(10px);animation:auas-in 10s ease infinite}
    .a-uas .row{display:flex;justify-content:space-between;font-size:12.5px}
    .a-uas .amt{color:var(--text-secondary);font-family:var(--mono)}
    .a-uas .bar{height:8px;border-radius:4px;background:var(--bg-secondary);margin:10px 0 8px;overflow:hidden}
    .a-uas .fill{height:100%;width:0;background:var(--accent);border-radius:4px;animation:auas-fill 10s ease infinite}
    .a-uas .meta{font-size:11.5px;color:var(--text-muted);font-family:var(--mono)}
    @keyframes auas-in{0%,10%{opacity:0;transform:translateY(10px)}20%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateY(10px)}}
    @keyframes auas-fill{0%,22%{width:0}50%,88%{width:24%}96%,100%{width:0}}
  </style>
</div>
