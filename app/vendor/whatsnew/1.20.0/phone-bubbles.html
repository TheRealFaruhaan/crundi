<div class="wna a-pbub">
  <div class="win">
    <div class="hd"><span class="mk">AS</span><b>App scoping</b></div>
    <i class="l l1"></i><i class="l l2"></i><i class="l me"></i><i class="l l3"></i>
    <div class="box"></div>
  </div>
  <span class="head h1">AS</span>
  <span class="head h2">LF</span>
  <style>
    .a-pbub .head{position:absolute;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 17px var(--mono,monospace);color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.55)}
    .a-pbub .h1{left:44px;top:52px;background:linear-gradient(135deg,#a855f7,#7c3aed);animation:apb-h1 10s ease infinite}
    .a-pbub .h2{left:44px;top:128px;background:linear-gradient(135deg,#10b981,#047857);animation:apb-h2 10s ease infinite}
    .a-pbub .win{position:absolute;left:150px;top:40px;width:420px;height:320px;border-radius:20px;border:1px solid var(--border);background:var(--bg-primary);box-shadow:0 22px 50px rgba(0,0,0,.6);transform-origin:0 12%;animation:apb-win 10s ease infinite;overflow:hidden}
    .a-pbub .hd{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border)}
    .a-pbub .mk{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 11px var(--mono,monospace);color:#fff;background:linear-gradient(135deg,#a855f7,#7c3aed)}
    .a-pbub .hd b{font-size:14px;font-weight:650;color:var(--text-primary)}
    .a-pbub .l{display:block;height:11px;border-radius:6px;background:var(--bg-card);margin:16px 20px 0}
    .a-pbub .l1{width:62%}.a-pbub .l2{width:44%}.a-pbub .l3{width:56%}
    .a-pbub .me{width:34%;margin-left:auto;margin-right:20px;background:var(--accent-dim);border:1px solid var(--accent);height:22px;border-radius:11px}
    .a-pbub .box{position:absolute;left:16px;right:16px;bottom:16px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg-secondary)}
    @keyframes apb-h1{0%,8%{scale:0;opacity:0}16%,30%{scale:1;opacity:1}34%{scale:.9}38%,100%{scale:1;opacity:1}}
    @keyframes apb-h2{0%,16%{scale:0;opacity:0}24%,100%{scale:1;opacity:1}}
    @keyframes apb-win{0%,34%{scale:.1;opacity:0}44%,82%{scale:1;opacity:1}92%,100%{scale:.1;opacity:0}}
    @media (prefers-reduced-motion:reduce){.a-pbub *{animation:none!important}.a-pbub .win,.a-pbub .head{opacity:1;scale:1}}
  </style>
</div>
