<div class="wna a-vtb">
  <div class="bar"><span class="mic"></span></div>
  <div class="drop"><div class="disc"></div><div class="t">Ask me anything, Master.</div></div>
  <div class="keys"><span>Ctrl</span><span>Space</span></div>
  <style>
    .a-vtb{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary)}
    .a-vtb .bar{position:absolute;left:40px;right:40px;top:30px;height:40px;border-radius:10px;background:var(--bg-secondary);border:1px solid var(--border)}
    .a-vtb .mic{position:absolute;right:18px;top:9px;width:22px;height:22px;border-radius:6px;border:1px solid var(--accent);background:var(--accent-dim)}
    .a-vtb .drop{position:absolute;right:40px;top:82px;width:240px;height:250px;border-radius:14px;border:1px solid var(--border);background:var(--bg-card);box-shadow:0 18px 50px rgba(0,0,0,.5);opacity:0;transform:translateY(-8px);animation:avtb-d 10s ease infinite}
    .a-vtb .disc{position:absolute;left:70px;top:40px;width:100px;height:100px;border-radius:50%;background:#05050a;box-shadow:0 0 0 2px var(--accent),0 0 0 10px var(--accent-dim),0 0 0 20px rgba(99,102,241,.08);animation:avtb-p 10s ease infinite}
    .a-vtb .t{position:absolute;left:0;right:0;top:175px;text-align:center;font-size:13px;color:var(--text-secondary)}
    .a-vtb .keys{position:absolute;left:80px;top:180px;display:flex;gap:8px;opacity:0;animation:avtb-k 10s ease infinite}
    .a-vtb .keys span{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-secondary);font-family:var(--mono);font-size:13px}
    @keyframes avtb-k{0%,10%{opacity:0}16%,40%{opacity:1;transform:translateY(2px)}46%,100%{opacity:0}}
    @keyframes avtb-d{0%,20%{opacity:0;transform:translateY(-8px)}26%,88%{opacity:1;transform:none}94%,100%{opacity:0}}
    @keyframes avtb-p{0%,30%,50%,70%,100%{transform:scale(1)}40%,60%{transform:scale(1.06)}}
  </style>
</div>
