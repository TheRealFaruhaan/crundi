<div class="wna a-look">

  <style>
    .a-look{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
    .a-look .glow{position:absolute;left:50%;top:44%;width:420px;height:300px;margin:-150px 0 0 -210px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-dim),transparent)}
    .a-look .cb-mini{width:150px;height:150px;position:relative;transform-origin:50% 62%;animation:alk-in 9s ease-out infinite}
    .a-look .cb-mini *{transform-box:fill-box;transform-origin:center}
    .a-look .cb-mini .cb-arm{transform-origin:center top}
    .a-look .cb-word{height:44px;width:auto;position:relative;color:var(--text-primary)}
    .a-look .cb-eye{animation:alk-blink 9s ease-in-out infinite}
    .a-look .cb-arm-r{animation:alk-wave 9s ease-in-out infinite}
    .a-look .cb-head{animation:alk-nod 9s ease-in-out infinite}
    .a-look .cb-tip,.a-look .cb-light{animation:alk-pulse 9s ease-in-out infinite}
    .a-look .cb-word path{stroke-dasharray:1;animation:alk-draw 9s ease-out infinite}
    .a-look .cb-word path:nth-of-type(2){animation-delay:.1s}.a-look .cb-word path:nth-of-type(3){animation-delay:.2s}.a-look .cb-word path:nth-of-type(4){animation-delay:.3s}.a-look .cb-word path:nth-of-type(5){animation-delay:.4s}.a-look .cb-word path:nth-of-type(6){animation-delay:.5s}
    .a-look .cb-dot{transform-box:fill-box;transform-origin:center;animation:alk-dot 9s ease-out infinite}
    @keyframes alk-in{0%{transform:translateY(26px) scale(.6);opacity:0}6%{transform:translateY(-5px) scale(1.04);opacity:1}9%,93%{transform:none;opacity:1}100%{transform:scale(.92);opacity:0}}
    @keyframes alk-blink{0%,10%,14%,44%,48%,78%,82%,100%{transform:scaleY(1)}12%,46%,80%{transform:scaleY(.1)}}
    @keyframes alk-wave{0%,14%,34%,100%{transform:rotate(0)}17%,23%,29%{transform:rotate(-34deg)}20%,26%,32%{transform:rotate(-8deg)}}
    @keyframes alk-nod{0%,52%,88%,100%{transform:none}58%,70%,82%{transform:translateY(-4px)}64%,76%{transform:none}}
    @keyframes alk-pulse{0%,52%,88%,100%{transform:scale(1)}58%,70%,82%{transform:scale(.7)}64%,76%{transform:scale(1)}}
    @keyframes alk-draw{0%,22%{stroke-dashoffset:1;opacity:0}23%{opacity:1}30%,93%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes alk-dot{0%,36%{transform:scale(0);opacity:0}39%{transform:scale(1.3);opacity:1}41%,93%{transform:scale(1);opacity:1}100%{opacity:0}}
  </style>
</div>
