  <style>
    .a-phone .glow{position:absolute;left:36%;top:50%;width:420px;height:320px;margin:-160px 0 0 -210px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-dim),transparent)}
    .a-phone .code{position:absolute;left:92px;top:50px;width:300px;height:300px;overflow:visible;animation:aph-all 10s ease infinite}
    .a-phone .ring{fill:none;stroke-width:4.87;stroke-linecap:round;transform-origin:0 0}
    .a-phone .go{transform-origin:0 0;animation:aph-gone 10s cubic-bezier(.6,0,.85,.35) infinite}
    .a-phone .ring0{animation:aph-cw 10s linear infinite}.a-phone .ring1{animation:aph-ccw 10s linear infinite}.a-phone .ring2{animation:aph-cw 10s linear infinite}.a-phone .ring3{animation:aph-ccw 10s linear infinite}.a-phone .ring4{animation:aph-cw 10s linear infinite}
    .a-phone .find{fill:none;stroke:#818cf8;stroke-width:3.5;transform-origin:0 0}
    .a-phone .fin{animation:aph-seal 10s ease infinite}.a-phone .fout{animation:aph-close 10s cubic-bezier(.6,0,.3,1) infinite}
    .a-phone .logo{transform-origin:0 0;animation:aph-hop 10s ease infinite}
    .a-phone .tick{transform-origin:0 0;animation:aph-tick 10s cubic-bezier(.2,1.5,.3,1) infinite}
    .a-phone .tick circle{fill:var(--green);stroke:var(--bg-primary);stroke-width:3}
    .a-phone .tick path{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:aph-draw 10s ease-out infinite}
    .a-phone .phone{position:absolute;left:440px;top:92px;width:118px;height:216px;border-radius:22px;background:var(--bg-card);border:2px solid var(--border);box-shadow:0 14px 40px rgba(0,0,0,.45);animation:aph-phone 10s cubic-bezier(.3,.8,.3,1) infinite}
    .a-phone .scr{position:absolute;inset:9px;border-radius:14px;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .a-phone .vf{width:62px;height:62px;border-radius:14px;border:2px solid var(--accent-hover);animation:aph-vf 10s ease infinite}
