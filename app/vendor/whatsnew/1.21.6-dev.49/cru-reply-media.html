<div class="wna a-crm">

  </div>
  <style>
    .a-crm{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:13px}
    .a-crm .win{position:absolute;left:120px;top:24px;width:400px;height:352px;border-radius:16px;background:var(--bg-secondary);border:1px solid var(--border)}
    .a-crm .me{position:absolute;right:16px;top:16px;padding:8px 12px;border-radius:14px 14px 4px 14px;background:var(--accent-dim);border:1px solid var(--accent);animation:acrm1 10s ease infinite}
    .a-crm .cru{position:absolute;left:16px;top:62px;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--bg-card);border:1px solid var(--border);opacity:0;animation:acrm2 10s ease infinite}
    .a-crm .card{position:absolute;left:16px;top:106px;width:200px;box-sizing:border-box;padding:10px 12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);opacity:0;animation:acrm3 10s ease infinite}
    .a-crm .card .t{font-weight:600;color:var(--text-secondary);margin-bottom:6px}

    .a-crm .ok{color:var(--green);font-weight:500}.a-crm .bad{color:#f87171;font-weight:500}
    .a-crm .bar{margin-top:9px;height:7px;border-radius:4px;background:var(--bg-primary);overflow:hidden}

    .a-crm .pic{position:absolute;left:228px;top:106px;width:156px;height:108px;border-radius:12px;background:var(--bg-primary);border:1px solid var(--border);display:flex;align-items:flex-end;gap:8px;padding:12px;box-sizing:border-box;opacity:0;animation:acrm4 10s ease infinite}
    .a-crm .b{flex:1;background:var(--accent);border-radius:3px 3px 0 0}
    .a-crm .b1{height:40%}.a-crm .b2{height:80%}.a-crm .b3{height:55%}.a-crm .b4{height:95%}
    .a-crm .file{position:absolute;left:16px;top:244px;width:368px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);color:var(--accent);opacity:0;animation:acrm5 10s ease infinite}

    @keyframes acrm2{0%,14%{opacity:0;transform:translateY(6px)}20%,94%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes acrm3{0%,26%{opacity:0;transform:translateY(6px)}32%,94%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes acrm4{0%,38%{opacity:0;transform:translateY(6px)}44%,94%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes acrm5{0%,50%{opacity:0;transform:translateY(6px)}56%,94%{opacity:1;transform:none}100%{opacity:0}}
