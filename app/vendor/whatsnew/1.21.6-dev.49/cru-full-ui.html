<div class="wna a-cfu">
  <div class="win">
    <div class="top"><span class="mk"></span><span class="nv">&times;&nbsp; Normal view</span><span class="cx"></span></div>
    <div class="msgs"><div class="me"></div><div class="cru"></div><div class="me s"></div></div>
    <div class="ui"><i></i><i></i><i></i><i></i></div>
    <div class="bot"><span class="kb"></span><span class="orb"></span></div>
    <div class="tap"></div>
  </div>
  <style>
    .a-cfu{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:13px}
    .a-cfu .win{position:absolute;left:190px;top:30px;width:260px;height:340px;border-radius:18px;background:var(--bg-secondary);border:1px solid var(--border);overflow:hidden}
    .a-cfu .top{position:absolute;left:14px;right:14px;top:12px;height:26px;display:flex;align-items:center;gap:8px}
    .a-cfu .mk{width:30px;height:12px;border-radius:6px;background:var(--accent-hover);opacity:.7}
    .a-cfu .nv{margin-left:auto;padding:5px 11px;border-radius:13px;background:var(--accent);color:#fff;font-weight:600;font-size:11px;white-space:nowrap;opacity:0;animation:acfu-nv 10s ease infinite}
    .a-cfu .cx{width:24px;height:24px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border)}
    .a-cfu .msgs div{position:absolute;height:28px;border-radius:12px}
    .a-cfu .me{right:14px;top:60px;width:120px;background:var(--accent-dim);border:1px solid var(--accent)}
    .a-cfu .me.s{top:150px;width:90px}
    .a-cfu .cru{left:14px;top:104px;width:150px;background:var(--bg-card);border:1px solid var(--border)}
    .a-cfu .msgs{animation:acfu-m 10s ease infinite}
    .a-cfu .ui{position:absolute;left:12px;right:12px;top:50px;height:212px;display:grid;grid-template-columns:1fr 1fr;gap:8px;transform-origin:50% 0;animation:acfu-ui 10s ease infinite}
    .a-cfu .ui i{border-radius:10px;background:var(--accent-dim);border:1px solid var(--border)}
    .a-cfu .ui i:nth-child(2){background:var(--green);opacity:.55}.a-cfu .ui i:nth-child(3){background:var(--yellow-dim)}.a-cfu .ui i:nth-child(4){background:var(--bg-card)}
    .a-cfu .bot{position:absolute;left:0;right:0;bottom:12px;height:50px;display:flex;align-items:center;justify-content:center}
    .a-cfu .kb{position:absolute;left:18px;width:26px;height:26px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border)}
    .a-cfu .orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-hover),var(--accent))}
    .a-cfu .tap{position:absolute;right:56px;top:16px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;opacity:0;animation:acfu-t 10s ease infinite}
    @keyframes acfu-m{0%,18%{opacity:1}26%,74%{opacity:0}82%,100%{opacity:1}}
    @keyframes acfu-ui{0%,18%{opacity:0;transform:scale(.6)}28%,68%{opacity:1;transform:none}78%,92%{opacity:.9;transform:scaleY(.42)}100%{opacity:0;transform:scaleY(.42)}}
    @keyframes acfu-nv{0%,24%{opacity:0}30%,70%{opacity:1}74%,100%{opacity:0}}
    @keyframes acfu-t{0%,60%{opacity:0;transform:scale(1.6)}66%{opacity:1;transform:scale(1)}72%,100%{opacity:0;transform:scale(.8)}}
  </style>
</div>
