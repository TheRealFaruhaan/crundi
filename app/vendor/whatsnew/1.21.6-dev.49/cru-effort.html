<div class="wna a-cef">
  <div class="card">
    <b class="h">Thinking effort</b>
    <div class="row"><span class="c c1">Low</span><span class="c c2">Medium</span><span class="c c3">High</span><span class="c c4">Extra high</span><span class="c c5">Max</span></div>
    <div class="bar"><i></i></div>
  </div>
  <style>
    .a-cef{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:13px}
    .a-cef .card{position:absolute;left:90px;top:110px;width:460px;padding:22px;border-radius:14px;background:var(--bg-secondary);border:1px solid var(--border)}
    .a-cef .h{display:block;font-size:15px;margin-bottom:14px}
    .a-cef .row{display:flex;gap:8px}
    .a-cef .c{padding:7px 12px;border-radius:16px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary)}
    .a-cef .c1{animation:acef-1 10s ease infinite}.a-cef .c3{animation:acef-3 10s ease infinite}.a-cef .c5{animation:acef-5 10s ease infinite}
    .a-cef .bar{margin-top:18px;height:6px;border-radius:3px;background:var(--bg-card);overflow:hidden}
    .a-cef .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-hover),var(--accent));animation:acef-b 10s ease infinite}
    @keyframes acef-1{0%,30%{background:var(--accent);color:#fff;border-color:var(--accent)}34%,100%{background:var(--bg-card);color:var(--text-secondary);border-color:var(--border)}}
    @keyframes acef-3{0%,33%{background:var(--bg-card);color:var(--text-secondary)}37%,63%{background:var(--accent);color:#fff;border-color:var(--accent)}67%,100%{background:var(--bg-card);color:var(--text-secondary)}}
    @keyframes acef-5{0%,66%{background:var(--bg-card);color:var(--text-secondary)}70%,97%{background:var(--accent);color:#fff;border-color:var(--accent)}100%{background:var(--bg-card)}}
    @keyframes acef-b{0%,30%{width:18%}37%,63%{width:55%}70%,97%{width:100%}100%{width:18%}}
  </style>
</div>
