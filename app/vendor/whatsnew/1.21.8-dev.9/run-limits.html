<div class="wna a-rlm">
  <div class="card">
    <div class="hd"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 8a5 5 0 0 1 8.5-3.5M13 8a5 5 0 0 1-8.5 3.5M11.5 2v2.5H9M4.5 14v-2.5H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Run limits</b></div>
    <div class="f"><span class="lb">Build → Review</span><span class="used">3 used</span><span class="in"><span class="n n3">3</span><span class="n n6">6</span></span></div>
    <div class="f"><span class="lb">Time limit, minutes</span><span class="used">58 used</span><span class="in"><span class="n">60</span></span></div>
    <div class="f"><span class="lb">Handoff limit</span><span class="used">12 made</span><span class="in"><span class="n">40</span></span></div>
    <div class="ap">Apply to this run</div>
  </div>
  <div class="st"><span class="dot"></span><span class="s1">Stopped at a loop's limit</span><span class="s2">Running</span></div>
  <div class="mg">The run's limits changed</div>
  <svg class="cur" viewBox="0 0 16 16" width="18" height="18"><path d="M3 2l9 6-4 1 2.5 4.5-1.8 1-2.5-4.5L3 13z" fill="var(--text-primary)" stroke="var(--bg-primary)" stroke-width="1"/></svg>
  <style>
    .a-rlm{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:13px}
    .a-rlm .card{position:absolute;left:60px;top:60px;width:340px;border:1px solid var(--border);border-radius:12px;background:var(--bg-card);padding:14px 16px}
    .a-rlm .hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .a-rlm .hd svg{color:var(--accent)}
    .a-rlm .f{display:flex;align-items:center;gap:10px;height:36px}
    .a-rlm .lb{flex:1;color:var(--text-secondary);font-size:12px}
    .a-rlm .used{font-size:11px;color:var(--text-muted)}
    .a-rlm .in{position:relative;width:52px;height:26px;border:1px solid var(--border);border-radius:6px;background:var(--bg-secondary);font-family:var(--mono);font-size:12px}
    .a-rlm .f:nth-of-type(2) .in{animation:arlmI 10s infinite}
    .a-rlm .n{position:absolute;left:9px;top:5px}
    .a-rlm .n3{animation:arlmA 10s infinite}.a-rlm .n6{opacity:0;animation:arlmB 10s infinite}
    .a-rlm .ap{margin:12px 0 0 auto;width:max-content;padding:6px 14px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;animation:arlmK 10s infinite}
    .a-rlm .st{position:absolute;left:430px;top:80px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;background:var(--bg-card);padding:6px 12px;font-size:12px}
    .a-rlm .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:arlmD 10s infinite}
    .a-rlm .s2{display:none;animation:arlmS2 10s infinite}.a-rlm .s1{animation:arlmS1 10s infinite}
    .a-rlm .mg{position:absolute;left:430px;top:140px;width:170px;padding:8px 10px;border-radius:10px;background:var(--bg-secondary);border:1px solid var(--border);font-size:12px;color:var(--text-secondary);opacity:0;animation:arlmM 10s infinite}
    .a-rlm .cur{position:absolute;left:0;top:0;animation:arlmC 10s infinite}
    @keyframes arlmI{0%,14%{border-color:var(--border)}18%,40%{border-color:var(--accent)}44%,100%{border-color:var(--border)}}
    @keyframes arlmA{0%,28%{opacity:1}30%,96%{opacity:0}100%{opacity:1}}
    @keyframes arlmB{0%,28%{opacity:0}30%,96%{opacity:1}100%{opacity:0}}
    @keyframes arlmK{0%,48%{filter:none}50%,54%{filter:brightness(.8)}56%,100%{filter:none}}
    @keyframes arlmD{0%,56%{background:var(--yellow)}60%,96%{background:var(--green)}100%{background:var(--yellow)}}
    @keyframes arlmS1{0%,56%{display:inline}60%,100%{display:none}}
    @keyframes arlmS2{0%,56%{display:none}60%,96%{display:inline}100%{display:none}}
    @keyframes arlmM{0%,64%{opacity:0;transform:translateY(6px)}70%,94%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes arlmC{0%{transform:translate(260px,320px)}14%,40%{transform:translate(370px,124px)}48%,56%{transform:translate(350px,214px)}70%,100%{transform:translate(300px,330px)}}
  </style>
</div>
