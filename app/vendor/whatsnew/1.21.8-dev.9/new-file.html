<div class="wna a-nfl">
  <div class="files">
    <div class="bar"><span class="path">src</span><span class="plus"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span></div>
    <div class="row"><span class="fi"></span>app.js</div>
    <div class="row new"><span class="fi"></span>notes.md</div>
    <div class="row"><span class="fi"></span>server.js</div>
  </div>
  <div class="dlg">
    <div class="dh">New file</div>
    <div class="in"><span class="tx">notes.md</span><span class="caret"></span></div>
    <div class="ok">Create</div>
  </div>
  <div class="ed"><div class="tab">notes.md</div><div class="body"><span class="caret2"></span></div></div>
  <svg class="cur" viewBox="0 0 16 16" width="18" height="18"><path d="M3 2l9 6-4 1 2.5 4.5-1.8 1-2.5-4.5L3 13z" fill="var(--text-primary)" stroke="var(--bg-primary)" stroke-width="1"/></svg>
  <style>
    .a-nfl{position:absolute;inset:0;font-family:system-ui,sans-serif;color:var(--text-primary);font-size:13px}
    .a-nfl .files{position:absolute;left:50px;top:70px;width:220px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);overflow:hidden}
    .a-nfl .bar{display:flex;align-items:center;padding:8px 10px;background:var(--bg-secondary);border-bottom:1px solid var(--border)}
    .a-nfl .path{color:var(--text-secondary);font-family:var(--mono);font-size:12px}
    .a-nfl .plus{margin-left:auto;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);animation:anflB 10s infinite}
    .a-nfl .row{display:flex;align-items:center;gap:8px;padding:0 12px;height:32px;font-family:var(--mono);font-size:12px;overflow:hidden}
    .a-nfl .fi{width:10px;height:12px;border:1.5px solid var(--text-muted);border-radius:2px}
    .a-nfl .new{animation:anflR 10s infinite}
    .a-nfl .dlg{position:absolute;left:300px;top:90px;width:260px;border:1px solid var(--border);border-radius:12px;background:var(--bg-card);padding:14px;opacity:0;animation:anflD 10s infinite}
    .a-nfl .dh{font-weight:600;margin-bottom:10px}
    .a-nfl .in{display:flex;align-items:center;height:30px;border:1px solid var(--accent);border-radius:6px;padding:0 8px;background:var(--bg-secondary);font-family:var(--mono);font-size:12px}
    .a-nfl .tx{display:inline-block;overflow:hidden;white-space:nowrap;width:0;animation:anflT 10s steps(8,end) infinite}
    .a-nfl .caret{width:1.5px;height:15px;background:var(--text-primary);margin-left:1px}
    .a-nfl .ok{margin:12px 0 0 auto;width:max-content;padding:5px 14px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;animation:anflK 10s infinite}
    .a-nfl .ed{position:absolute;left:300px;top:90px;width:290px;height:200px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);overflow:hidden;opacity:0;animation:anflE 10s infinite}
    .a-nfl .tab{display:inline-block;padding:7px 14px;font-family:var(--mono);font-size:12px;background:var(--bg-secondary);border-right:1px solid var(--border);border-bottom:2px solid var(--accent)}
    .a-nfl .body{padding:12px;border-top:1px solid var(--border)}
    .a-nfl .caret2{display:block;width:1.5px;height:15px;background:var(--text-primary);animation:anflC 1s steps(1) infinite}
    .a-nfl .cur{position:absolute;left:0;top:0;animation:anflM 10s infinite}
    @keyframes anflB{0%,10%{background:transparent;color:var(--text-secondary)}12%,18%{background:var(--accent-dim);color:var(--accent)}22%,100%{background:transparent;color:var(--text-secondary)}}
    @keyframes anflR{0%,56%{height:0;background:transparent}60%{height:32px;background:var(--accent-dim)}88%{height:32px;background:var(--accent-dim)}94%{height:32px;background:transparent}100%{height:0}}
    @keyframes anflD{0%,15%{opacity:0;transform:scale(.96)}20%,54%{opacity:1;transform:none}58%,100%{opacity:0}}
    @keyframes anflT{0%,24%{width:0}42%,100%{width:8ch}}
    @keyframes anflK{0%,48%{filter:none}50%,53%{filter:brightness(.8)}}
    @keyframes anflE{0%,58%{opacity:0}64%,94%{opacity:1}100%{opacity:0}}
    @keyframes anflC{0%{opacity:1}50%{opacity:0}}
    @keyframes anflM{0%{transform:translate(200px,300px)}10%,18%{transform:translate(252px,86px)}40%{transform:translate(500px,250px)}47%,53%{transform:translate(540px,184px)}62%,100%{transform:translate(560px,330px)}}
  </style>
</div>
