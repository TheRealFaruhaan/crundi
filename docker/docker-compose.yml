# Crundi standalone server.
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml exec crundi claude    # log in, once
#
# Then point a browser — or the Windows desktop app, via Tray → Server… — at
# http://<this-host>:8888. The desktop app additionally lends this server a GUI,
# so the browser panel works even though nothing here can render.

services:
  crundi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: crundi:latest
    container_name: crundi
    restart: unless-stopped

    ports:
      - "8888:8888"
      # Uncomment BOTH for TLS_MODE=letsencrypt. Port 80 is not optional there:
      # the CA fetches the challenge over it and will not follow a redirect.
      # - "443:443"
      # - "80:80"

    environment:
      # Optional: password sign-in works instead. Set both to use Telegram for
      # sign-in and notifications.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      ALLOWED_USERNAME: "${ALLOWED_USERNAME:-}"
      # Optional: expose the server publicly through a Cloudflare tunnel.
      CLOUDFLARE_TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
      CLOUDFLARE_TUNNEL_URL: "${CLOUDFLARE_TUNNEL_URL:-}"
      # Optional password sign-in, set before first start. Otherwise use the
      # first-run screen.
      CRUNDI_PASSWORD_HASH: "${CRUNDI_PASSWORD_HASH:-}"
      CRUNDI_TOTP_SECRET: "${CRUNDI_TOTP_SECRET:-}"
      # HTTPS. Off by default — behind a tunnel or proxy this machine should
      # only ever see plain HTTP.
      TLS_MODE: "${TLS_MODE:-off}"
      TLS_DOMAIN: "${TLS_DOMAIN:-}"
      TLS_EMAIL: "${TLS_EMAIL:-}"
      TLS_STAGING: "${TLS_STAGING:-1}"
      TLS_CERT_PATH: "${TLS_CERT_PATH:-}"
      TLS_KEY_PATH: "${TLS_KEY_PATH:-}"

    volumes:
      # Claude's own credentials. You run `claude` once inside the container to
      # log in; this keeps that login across rebuilds. It holds live auth
      # tokens, so treat it as a secret.
      - claude-auth:/root/.claude
      # Crundi's own state: projects list, kanban, transcripts, schedules.
      - crundi-data:/data
      # Your code. Point this at wherever your repositories live. Read-write —
      # the whole purpose is to let Claude edit them.
      - ${PROJECTS_DIR:-./projects}:/projects

volumes:
  claude-auth:
  crundi-data:
