[package]
name = "crundi-browser-host"
description = "The browser host: Chromium (CEF) and every web view, in a process of its own, started by the app (crates/webview). The only part that links libcef"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "crundi-browser-host"
path = "src/main.rs"

[dependencies]
cef.workspace = true
serde_json.workspace = true
crundi-browser-link.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
