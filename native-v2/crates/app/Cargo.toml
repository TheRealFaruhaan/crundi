[package]
name = "crundi-app"
description = "The native PC client v2: makes the stores, registers every area, opens the window, the test driver (thin)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "crundi-v2"
path = "src/main.rs"

# The frame floor (perf/README.md): GPUI's own cost per frame, no server.
[[bin]]
name = "crundi-v2-floor"
path = "src/floor.rs"

# Where a frame goes (perf/README.md): gpui's profiler and the frame
# journal (src/journal.rs). Measurement builds only, never a release.
[features]
frame-journal = ["gpui/profiler", "dep:pprof"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
futures.workspace = true
serde_json.workspace = true
env_logger.workspace = true
raw-window-handle = "0.6"
image.workspace = true
crundi-core.workspace = true
crundi-theme.workspace = true
crundi-widgets.workspace = true
crundi-shell.workspace = true
crundi-workbench.workspace = true
crundi-chat.workspace = true
crundi-planning.workspace = true
crundi-workspace.workspace = true
crundi-operations.workspace = true

# The in-process sampler (frame-journal builds only, Linux and macOS: src/journal.rs).
[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", default-features = false, features = ["frame-pointer"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
