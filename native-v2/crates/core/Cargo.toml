[package]
name = "crundi-core"
description = "The client's non-UI core (no GPUI): the server's API, the live link, the saved login, the chat model and its rules, voice I/O, the test driver's protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tungstenite.workspace = true
ureq.workspace = true
gethostname.workspace = true
chrono.workspace = true
log.workspace = true
# A chat code block's colours (core::syntax): the crates and features
# gpui-component already builds with "syntect".
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
cpal.workspace = true
rodio.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tts.workspace = true
