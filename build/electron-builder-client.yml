# Client-only Windows installer.
#
# The desktop app WITHOUT a server: it attaches to one running elsewhere (a
# container, another machine) and lends it this machine's GUI, so the browser
# panel still works. Distinct appId and productName so it installs alongside the
# all-in-one build rather than replacing it — that build is unchanged and stays
# the default for people who want everything on one machine.
#
#   npx electron-builder --win --config build/electron-builder-client.yml
#
# Note there is no `src` here. That omission is what tells the app at runtime
# that it is a client (see serverBundled in app/main.js), so there is no build
# flag to set and no way for the two to disagree.

appId: com.crundi.client
productName: Crundi Client

# Electron derives userData from productName (falling back to name), and the
# packaged manifest carries neither unless it is put there — so both builds
# resolved to %APPDATA%\crundi and SHARED a data directory. Separate install
# dirs are not enough: client.json lives in userData, so pointing the client at
# a remote server would have made the all-in-one read mode:remote and quietly
# stop starting its own server.
extraMetadata:
  name: crundi-client
  productName: Crundi Client
npmRebuild: false
directories:
  # Its own output tree. Sharing dist/ with the all-in-one build means sharing
  # dist/win-unpacked, and the second build fails renaming an electron.exe the
  # first one already renamed.
  output: dist/client
# No space in the filename. productName is "Crundi Client", and GitHub turns
# the space into a dot in the asset name while electron-builder writes a hyphen
# into the update manifest - so the updater asked for a file that did not exist
# and the download 404'd. Spelled out here so the two always agree.
artifactName: Crundi-Client-Setup-${version}.${ext}

# A channel of its own, so this build publishes client.yml instead of
# latest.yml. Both installers go to the SAME GitHub release, so without this
# they collide on one filename - and since only the all-in-one job uploaded its
# yml, the client read that one and updated itself into the full PC version.
publish:
  - provider: github
    owner: TheRealFaruhaan
    repo: crundi
    releaseType: release
    channel: client

files:
  - app/main.js
  - app/preload.js
  - app/index.html
  - package.json
  - "!**/.env"
  # node_modules is an ALLOWLIST. The client speaks to a server over a websocket
  # and answers browser-panel requests; app/main.js loads only electron-updater
  # and ws (node-pty is inside try/catch and unreachable here). Excluding
  # server packages by name used to leave their dependencies behind - zod, ajv,
  # axios, node-forge, @peculiar, micromark - 27 MB nobody loads.
  # scripts/test-client-build-files.mjs fails `npm run check` if electron-updater
  # grows a dependency this list does not cover, so an update cannot ship a
  # client that dies on "Cannot find module".
  #
  # List every package BY NAME at the top level, even ones npm installs nested
  # (electron-updater/node_modules/fs-extra). electron-builder re-hoists the
  # tree when it packages, so a nested package lands at node_modules/<name> and
  # is filtered out unless named here - a build without these five loaded fine
  # from the source tree and failed on "Cannot find module 'fs-extra'" packaged.
  - "!node_modules/**/*"
  - node_modules/electron-updater/**/*
  - node_modules/ws/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/jsonfile/**/*
  - node_modules/semver/**/*
  - node_modules/universalify/**/*
  - node_modules/argparse/**/*
  - node_modules/debug/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/js-yaml/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/ms/**/*
  - node_modules/sax/**/*
  - node_modules/tiny-typed-emitter/**/*

# Chromium ships ~55 UI locales (47 MB unpacked). The app's own UI is English,
# and the locale only affects Chromium's built-in strings (context menus,
# dialogs), which fall back to English anyway.
electronLanguages:
  - en-US

# app/vendor is deliberately absent: xterm, CodeMirror and the chat renderer are
# served by whichever server this connects to, so shipping a second copy here
# would only risk it drifting out of step with the server's.

asarUnpack:
  - node_modules/**/*
  - package.json

extraResources:
  - from: assets
    to: assets

win:
  target:
    - nsis
  icon: assets/icon.ico

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Crundi Client
